<script>
// ============================================
// SUPABASE SETUP
// ============================================
const SUPABASE_URL = 'https://ipdjajuhfqmuuzjejlwn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwZGphanVoZnFtdXV6amVqbHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNDY2ODcsImV4cCI6MjA5MzYyMjY4N30.Y1w43s7vx2V_XkgYvSUB0xTIsnGGFWyCU09z_r_otEg';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================
// STATE
// ============================================
let state = {
  page: 'home',
  products: [],
  cart: JSON.parse(localStorage.getItem('pvr_cart') || '[]'),
  orders: [],
  search: '',
  category: 'all',
  adminLoggedIn: false,
  loading: false,
  selectedProduct: null,
};

function saveCart() {
  localStorage.setItem('pvr_cart', JSON.stringify(state.cart));
}

function cartTotal() {
  return state.cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
}

// ============================================
// RENDER
// ============================================
function render() {
  const app = document.getElementById('app');
  if (state.page === 'admin' && !state.adminLoggedIn) {
    app.innerHTML = renderAdminLogin();
  } else if (state.page === 'admin') {
    app.innerHTML = renderAdmin();
    loadAdminData();
  } else if (state.page === 'cart') {
    app.innerHTML = renderCart();
  } else if (state.page === 'checkout') {
    app.innerHTML = renderCheckout();
  } else if (state.page === 'track') {
    app.innerHTML = renderTrack();
  } else if (state.page === 'product') {
    app.innerHTML = renderProduct();
  } else {
    app.innerHTML = renderHome();
    loadProducts();
  }
  attachEvents();
}

// ============================================
// NAVBAR
// ============================================
function renderNav() {
  const cartCount = state.cart.reduce((s, i) => s + i.qty, 0);
  return `
  <nav class="bg-green-700 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-50 shadow">
    <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
      <span class="text-2xl">🌿</span>
      <span class="font-bold text-xl">PVR Agro</span>
    </div>
    <div class="flex items-center gap-4">
      <span class="cursor-pointer text-sm hover:underline" onclick="navigate('track')">Track Order</span>
      <span class="cursor-pointer relative" onclick="navigate('cart')">
        🛒
        ${cartCount > 0 ? `<span class="absolute -top-2 -right-2 bg-yellow-400 text-black text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">${cartCount}</span>` : ''}
      </span>
    </div>
  </nav>`;
}

// ============================================
// HOME
// ============================================
function renderHome() {
  const categories = ['all', 'Bio-Pesticides', 'Pesticides', 'Fungicides', 'Seeds', 'Fertilizers', 'Herbicides', 'Weedicides'];
  const filtered = state.products.filter(p => {
    const matchCat = state.category === 'all' || p.category === state.category;
    const matchSearch = p.name.toLowerCase().includes(state.search.toLowerCase()) ||
  (p.chemical_name && p.chemical_name.toLowerCase().includes(state.search.toLowerCase())) ||
  (p.company_name && p.company_name.toLowerCase().includes(state.search.toLowerCase()));
    return matchCat && matchSearch;
  });

  return `
  ${renderNav()}
  <div class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex gap-2 mb-4">
      <input id="searchInput" type="text" placeholder="Search products..." value="${state.search}"
        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-green-500"
        oninput="state.search=this.value;" onkeydown="if(event.key==='Enter'){state.search=this.value; render();}" />
      <button onclick="renderProducts()" class="bg-green-700 text-white px-4 py-2 rounded-lg text-sm">Search</button>
      </div>
    <div class="flex gap-2 overflow-x-auto pb-2 mb-6">
      ${categories.map(c => `
        <button onclick="state.category='${c}'; render();"
          class="whitespace-nowrap px-3 py-1 rounded-full text-sm font-medium border transition
          ${state.category === c ? 'bg-green-700 text-white border-green-700' : 'bg-white text-gray-700 border-gray-300'}">
          ${c === 'all' ? 'All Products' : c}
        </button>`).join('')}
    </div>
    ${state.loading ? '<div class="text-center py-10 text-gray-500">Loading products...</div>' : ''}
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="product_grid">
      ${filtered.map(p => `
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 cursor-pointer hover:shadow-md transition"
          onclick="state.selectedProduct='${p.id}'; state.page='product'; render();">
          <div class="w-full h-28 bg-green-50 rounded-lg flex items-center justify-center mb-2 text-4xl">
            ${p.image_url ? `<img src="${p.image_url}" class="w-full h-full object-cover rounded-lg" />` : getCategoryEmoji(p.category)}
          </div>
          <div class="font-semibold text-gray-800 text-sm">${p.name}</div>
          <div class="text-xs text-gray-500 mb-1">${p.company_name ? p.company_name + ' · ' : ''}${p.category}</div>
${p.chemical_name ? `<div class="text-xs text-blue-400">${p.chemical_name}</div>` : ''}
          ${p.variants && p.variants.length > 0 ? `
            <div class="text-xs text-gray-400">MRP: ₹${p.variants[0].mrp || '-'}</div>
            <div class="text-green-700 font-bold text-sm">₹${p.variants[0].price}</div>
          ` : '<div class="text-xs text-gray-400">No variants</div>'}
        </div>`).join('')}
    </div>
    ${filtered.length === 0 && !state.loading ? '<div class="text-center py-10 text-gray-400">No products found</div>' : ''}
  </div>`;
}

function getCategoryEmoji(cat) {
  const map = {
    'Bio-Pesticides': '🌿',
    'Pesticides': '🧪',
    'Seeds': '🌱',
    'Fertilizers': '💊',
    'Herbicides': '🌾',
    'Weedicides': '☘️',
  };
  return map[cat] || '📦';
}

// ============================================
// PRODUCT PAGE
// ============================================
function renderProduct() {
  const product = state.products.find(p => p.id === state.selectedProduct);
  if (!product) return `${renderNav()}<div class="p-8 text-center">Product not found</div>`;
  const variants = product.variants || [];
  return `
  ${renderNav()}
  <div class="max-w-xl mx-auto px-4 py-6">
    <button onclick="navigate('home')" class="text-green-700 mb-4 flex items-center gap-1">← Back</button>
    <div class="bg-white rounded-xl shadow p-4">
      <div class="w-full h-48 bg-green-50 rounded-xl flex items-center justify-center text-6xl mb-4">
        ${product.image_url ? `<img src="${product.image_url}" class="w-full h-full object-cover rounded-xl" />` : getCategoryEmoji(product.category)}
      </div>
      <h1 class="text-xl font-bold text-gray-800">${product.name}</h1>
      <p class="text-sm text-gray-500 mb-1">${product.category}</p>
      <p class="text-sm text-gray-600 mb-4">${product.description || ''}</p>
      <div class="space-y-3">
        ${variants.filter(v => v.price > 0).map(v => `
          <div class="border border-gray-200 rounded-lg p-3 flex items-center justify-between">
            <div>
              <div class="font-semibold text-gray-800">${v.bag_size}</div>
              <div class="text-xs text-gray-400">MRP: ₹${v.mrp || '-'}</div>
              <div class="text-green-700 font-bold">Price: ₹${v.price}</div>
              <div class="text-xs text-gray-400">Stock: ${v.stock_quantity}</div>
            </div>
            <button onclick="addToCart('${product.id}','${v.id}','${product.name}','${v.bag_size}',${v.price})"
              class="bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-800">
              Add to Cart
            </button>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

// ============================================
// LOAD DATA
// ============================================
async function loadProducts() {
  state.loading = true;
  const { data: products } = await db.from('products').select('*').eq('is_available', true).order('name');
  const { data: variants } = await db.from('product_variants').select('*').gt('price', 0);
  state.products = (products || []).map(p => ({
    ...p,
    variants: (variants || []).filter(v => v.product_id === p.id)
  }));
  state.loading = false;
  render();
}
function renderProducts() {
  const filtered = state.products.filter(p => {
    const matchCat = state.category === 'all' || p.category === state.category;
    const matchSearch = p.name.toLowerCase().includes(state.search.toLowerCase()) ||
      (p.chemical_name && p.chemical_name.toLowerCase().includes(state.search.toLowerCase())) ||
      (p.company_name && p.company_name.toLowerCase().includes(state.search.toLowerCase()));
    return matchCat && matchSearch;
  });
  const grid = document.getElementById('product_grid');
  if (grid) grid.innerHTML = filtered.map(p => `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 cursor-pointer hover:shadow-md transition"
      onclick="state.selectedProduct='${p.id}'; state.page='product'; render();">
      <div class="w-full h-28 bg-green-50 rounded-lg flex items-center justify-center mb-2 text-4xl">
        ${p.image_url ? `<img src="${p.image_url}" class="w-full h-full object-cover rounded-lg" />` : getCategoryEmoji(p.category)}
      </div>
      <div class="font-semibold text-gray-800 text-sm">${p.name}</div>
      <div class="text-xs text-gray-500 mb-1">${p.company_name ? p.company_name + ' · ' : ''}${p.category}</div>
      ${p.chemical_name ? `<div class="text-xs text-blue-400">${p.chemical_name}</div>` : ''}
      ${p.variants && p.variants.length > 0 ? `
        <div class="text-xs text-gray-400">MRP: ₹${p.variants[0].mrp || '-'}</div>
        <div class="text-green-700 font-bold text-sm">₹${p.variants[0].price}</div>
      ` : '<div class="text-xs text-gray-400">No variants</div>'}
    </div>`).join('');
}
async function loadAdminData() {
  showAdminTab('orders');
}

async function showAdminTab(tab) {
  const content = document.getElementById('admin_content');
  if (!content) return;
  content.innerHTML = '<div class="text-center py-10 text-gray-400">Loading...</div>';

  if (tab === 'orders') {
    const { data: orders } = await db.from('orders').select('*, customers(name, phone)').order('created_at', { ascending: false });
    const { data: items } = await db.from('order_items').select('*, products(name), product_variants(bag_size)');
    content.innerHTML = `
      <h2 class="text-xl font-bold mb-4">Orders</h2>
      ${(orders || []).length === 0 ? '<div class="text-gray-400">No orders yet</div>' : ''}
      <div class="space-y-4">
        ${(orders || []).map(o => {
          const orderItems = (items || []).filter(i => i.order_id === o.id);
          return `
          <div class="bg-white rounded-xl shadow p-4">
            <div class="flex justify-between items-start mb-2">
              <div>
                <div class="font-bold">${o.customers?.name || 'Unknown'}</div>
                <div class="text-sm text-gray-500">${o.customers?.phone || ''}</div>
                <div class="text-xs text-gray-400">${new Date(o.created_at).toLocaleString()}</div>
              </div>
              <div class="text-right">
                <div class="font-bold text-green-700">₹${o.total_amount}</div>
                <div class="text-xs text-blue-600">${o.payment_method}</div>
                <select onchange="updateOrderStatus('${o.id}', this.value)"
                  class="text-xs border rounded px-1 py-0.5 mt-1">
                  ${['pending','confirmed','processing','delivered','cancelled'].map(s =>
                    `<option value="${s}" ${o.order_status === s ? 'selected' : ''}>${s}</option>`
                  ).join('')}
                </select>
              </div>
            </div>
            <div class="text-sm text-gray-600 border-t pt-2">
              ${orderItems.map(i => `${i.products?.name} (${i.product_variants?.bag_size}) x${i.quantity}`).join(', ')}
            </div>
            ${o.shipping_address ? `<div class="text-xs text-gray-400 mt-1">📍 ${o.shipping_address}</div>` : ''}
            ${o.transport_name ? `<div class="text-xs text-gray-400">🚚 ${o.transport_name}</div>` : ''}
            ${o.gst_number ? `<div class="text-xs text-gray-400">GST: ${o.gst_number}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`;

  } else if (tab === 'products') {
    const { data: products } = await db.from('products').select('*, product_variants(*)');
    content.innerHTML = `
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Products</h2>
        <button onclick="showAddProduct()" class="bg-green-700 text-white px-4 py-2 rounded-lg text-sm">+ Add Product</button>
      </div>
      <div id="add_product_form"></div>
      <div class="space-y-3">
        ${(products || []).map(p => `
          <div class="bg-white rounded-xl shadow p-4">
            <div class="flex justify-between items-center">
              <div>
                <div class="font-bold">${p.name}</div>
                <div class="text-sm text-gray-500">${p.category}</div>
              </div>
              <div class="flex items-center gap-2">
  <div class="text-xs text-gray-400">${(p.product_variants || []).length} variants</div>
  <button onclick="deleteProduct('${p.id}')" class="text-red-400 text-xs hover:text-red-600">🗑 Delete</button>
</div>
            </div>
            <div class="mt-2 space-y-1">
              ${(p.product_variants || []).map(v => `
                <div class="text-xs text-gray-600 flex gap-4">
                  <span>${v.bag_size}</span>
                  <span>MRP: ₹${v.mrp || '-'}</span>
                  <span class="text-green-700">Price: ₹${v.price}</span>
                  <span>Stock: ${v.stock_quantity}</span>
                </div>`).join('')}
            </div>
          </div>`).join('')}
      </div>`;

  } else if (tab === 'credit') {
    const { data: credits } = await db.from('credit_summary').select('*');
    content.innerHTML = `
      <h2 class="text-xl font-bold mb-4">Credit Ledger</h2>
      ${(credits || []).length === 0 ? '<div class="text-gray-400">No credit orders yet</div>' : ''}
      <div class="space-y-3">
        ${(credits || []).map(c => `
          <div class="bg-white rounded-xl shadow p-4">
            <div class="flex justify-between items-center">
              <div>
                <div class="font-bold">${c.name}</div>
                <div class="text-sm text-gray-500">${c.phone}</div>
                <div class="text-xs text-gray-400">${c.total_orders} order(s) · Last: ${new Date(c.last_order).toLocaleDateString()}</div>
              </div>
              <div class="text-right">
                <div class="text-xs text-gray-400">Total Owed</div>

// ============================================
// ACTIONS
// ============================================
function addToCart(productId, variantId, name, size, price) {
  const existing = state.cart.find(i => i.variantId === variantId);
  if (existing) {
    existing.qty += 1;
  } else {
    state.cart.push({ productId, variantId, name, size, price, qty: 1 });
  }
  saveCart();
  alert(`${name} (${size}) added to cart! 🛒`);
  render();
}

function updateQty(index, delta) {
  state.cart[index].qty += delta;
  if (state.cart[index].qty <= 0) state.cart.splice(index, 1);
  saveCart();
  render();
}

function removeItem(index) {
  state.cart.splice(index, 1);
  saveCart();
  render();
}

async function placeOrder() {
  const name = document.getElementById('co_name').value.trim();
  const phone = document.getElementById('co_phone').value.trim();
  const gst = document.getElementById('co_gst').value.trim();
  const address = document.getElementById('co_address').value.trim();
  const transport = document.getElementById('co_transport').value.trim();
  const payment = document.querySelector('input[name="payment"]:checked')?.value || 'cod';

  if (!name || !phone || !address) {
    alert('Please fill in Name, Phone and Shipping Address!');
    return;
  }

  try {
    // Upsert customer
    const { data: customer } = await db.from('customers')
      .upsert({ name, phone, address, gst_number: gst, transport_name: transport }, { onConflict: 'phone' })
      .select().single();

    // Create order
    const { data: order } = await db.from('orders').insert({
      customer_id: customer.id,
      total_amount: cartTotal(),
      payment_method: payment,
      payment_status: payment === 'online' ? 'pending' : 'pending',
      order_status: 'pending',
      gst_number: gst,
      shipping_address: address,
      transport_name: transport,
    }).select().single();

    // Insert order items
    const orderItems = state.cart.map(i => ({
      order_id: order.id,
      product_id: i.productId,
      variant_id: i.variantId,
      quantity: i.qty,
      unit_price: i.price,
      total_price: i.price * i.qty,
    }));
    await db.from('order_items').insert(orderItems);

    // If credit, add to ledger
    if (payment === 'credit') {
      await db.from('credit_ledger').insert({
        customer_id: customer.id,
        order_id: order.id,
        amount: cartTotal(),
        type: 'debit',
        note: 'Credit order placed',
      });
    }

    state.cart = [];
    saveCart();
    alert(`Order placed successfully! 🌿\nYour order ID: ${order.id.substring(0,8).toUpperCase()}\nTrack with phone: ${phone}`);
    navigate('home');
  } catch (err) {
    alert('Error placing order. Please try again.');
    console.error(err);
  }
}

async function trackOrder() {
  const phone = document.getElementById('track_phone').value.trim();
  if (!phone) return;
  const results = document.getElementById('track_results');
  results.innerHTML = '<div class="text-gray-400 text-center">Searching...</div>';
  const { data: customers } = await db.from('customers').select('*').eq('phone', phone);
  if (!customers || customers.length === 0) {
    results.innerHTML = '<div class="text-red-400 text-center">No orders found for this number</div>';
    return;
  }
  const { data: orders } = await db.from('orders').select('*').eq('customer_id', customers[0].id).order('created_at', { ascending: false });
  results.innerHTML = (orders || []).map(o => `
    <div class="border rounded-lg p-3 mb-2">
      <div class="flex justify-between">
        <div class="font-bold text-sm">Order #${o.id.substring(0,8).toUpperCase()}</div>
        <div class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">${o.order_status}</div>
      </div>
      <div class="text-xs text-gray-500">${new Date(o.created_at).toLocaleString()}</div>
      <div class="text-green-700 font-bold">₹${o.total_amount}</div>
      <div class="text-xs text-gray-400">${o.payment_method}</div>
    </div>`).join('');
}

async function saveNewProduct() {
  const name = document.getElementById('np_name').value.trim();
  const category = document.getElementById('np_category').value;
  const desc = document.getElementById('np_desc').value.trim();
  if (!name) { alert('Product name is required!'); return; }

  const company = document.getElementById('np_company').value.trim();
const chemical = document.getElementById('np_chemical').value.trim();
const { data: product } = await db.from('products').insert({ name, category, description: desc, company_name: company, chemical_name: chemical, is_available: true }).select().single();

  const sizes = document.querySelectorAll('.variant_size');
  const mrps = document.querySelectorAll('.variant_mrp');
  const prices = document.querySelectorAll('.variant_price');
  const stocks = document.querySelectorAll('.variant_stock');

  const variants = [];
  for (let i = 0; i < sizes.length; i++) {
    if (sizes[i].value && prices[i].value) {
      variants.push({
        product_id: product.id,
        bag_size: sizes[i].value,
        mrp: parseFloat(mrps[i].value) || 0,
        price: parseFloat(prices[i].value),
        stock_quantity: parseInt(stocks[i].value) || 0,
      });
    }
  }
  if (variants.length > 0) await db.from('product_variants').insert(variants);
  alert('Product added successfully! 🌿');
  showAdminTab('products');
}
