          <thead><tr class="bg-gray-100 text-gray-600 text-xs"><th class="px-3 py-2 text-left"></th><th class="px-3 py-2 text-right">💵 Cash</th><th class="px-3 py-2 text-right">🏦 Bank</th></tr></thead>
          <tbody>
            <tr class="border-b"><td class="px-3 py-2 text-gray-500">Opening Balance</td><td class="px-3 py-2 text-right">${fmt(openCash)}</td><td class="px-3 py-2 text-right">${fmt(openBank)}</td></tr>
            <tr class="border-b"><td class="px-3 py-2 text-green-600">+ Money In</td><td class="px-3 py-2 text-right text-green-600">${fmt(cashIn)}</td><td class="px-3 py-2 text-right text-green-600">${fmt(bankIn)}</td></tr>

async function loadStockReport() {
  const result = document.getElementById('stock_report_result');
  if (!result) return;
  result.innerHTML = '<div class="text-center text-gray-400 py-6">Loading...</div>';
  const { data: products } = await db.from('products').select('*, product_variants(*, product_packagings(*))').order('name');
  let totalPurchaseValue = 0;
  let totalSaleValue = 0;
  let rows = [];

  (products || []).forEach(p => {
    (p.product_variants || []).forEach(v => {
      (v.product_packagings || []).forEach(pk => {
        const stock = pk.stock_quantity || 0;
        if (stock === 0) return;
        const salePrice = pk.price_per_box || 0;
        const costPrice = pk.cost_price || 0;
        const purchaseVal = costPrice * stock;
        const saleVal = salePrice * stock;
        totalPurchaseValue += purchaseVal;
        totalSaleValue += saleVal;
        rows.push({ name: p.name, size: v.bag_size, label: pk.box_label, stock, avgCost: costPrice, salePrice, purchaseVal, saleVal });
      });
    });
  });

  const fmt = n => '₹' + (n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });

  const zeroStock = [];
  (products || []).forEach(p => {
    (p.product_variants || []).forEach(v => {
      (v.product_packagings || []).forEach(pk => {
        if ((pk.stock_quantity || 0) === 0) {
          zeroStock.push({ name: p.name, size: v.bag_size, label: pk.box_label });
        }
      });
    });
  });

  result.innerHTML = `
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-red-50 rounded-xl shadow p-4 text-center">
        <div class="text-xs text-gray-500">Total Purchase Value</div>
        <div class="font-bold text-red-600 text-lg">${fmt(totalPurchaseValue)}</div>
        <div class="text-xs text-gray-400">(cost price × stock)</div>
      </div>
      <div class="bg-green-50 rounded-xl shadow p-4 text-center">
        <div class="text-xs text-gray-500">Total Sale Value</div>
        <div class="font-bold text-green-700 text-lg">${fmt(totalSaleValue)}</div>
        <div class="text-xs text-gray-400">(sell price × stock)</div>
      </div>
    </div>
    ${zeroStock.length > 0 ? (() => {
      const zeroGrouped = {};
      zeroStock.forEach(z => {
        if (!zeroGrouped[z.name]) zeroGrouped[z.name] = [];
        zeroGrouped[z.name].push(z);
      });
      return '<div class="bg-red-50 border border-red-200 rounded-xl mb-4 overflow-hidden"><div class="flex justify-between items-center px-4 py-3 cursor-pointer" onclick="document.getElementById(\'zero_stock_list\').classList.toggle(\'hidden\')"><div class="font-bold text-red-600">⚠️ Out of Stock (' + zeroStock.length + ' variants · ' + Object.keys(zeroGrouped).length + ' products)</div><span class="text-red-400 text-xs">▾ tap to expand</span></div><div id="zero_stock_list" class="hidden px-4 pb-3 space-y-2">' +
        Object.entries(zeroGrouped).map(([name, variants]) =>
          '<div class="bg-white rounded-lg overflow-hidden border border-red-100"><div class="font-medium text-red-700 text-xs px-3 py-2 bg-red-100">' + name + '</div>' +
          variants.map(z => '<div class="text-xs text-red-400 px-3 py-1 border-t border-red-50">' + z.size + ' · ' + z.label + '</div>').join('') +
          '</div>'
        ).join('') +
        '</div></div>';
    })() : ''}
    <div class="bg-white rounded-xl shadow p-4">
      <div class="font-bold text-gray-700 mb-3">📦 Stock by Product (${rows.length} variants with stock)</div>
      ${rows.length === 0 ? '<div class="text-gray-400 text-center py-4">No stock found</div>' :
      (() => {
        const grouped = {};
        rows.forEach(r => {
          if (!grouped[r.name]) grouped[r.name] = [];
          grouped[r.name].push(r);
        });
        return '<div class="space-y-3">' +
          Object.entries(grouped).map(([productName, variants]) => {
            const totalSaleVal = variants.reduce((s, r) => s + r.saleVal, 0);
            const totalPurVal = variants.reduce((s, r) => s + r.purchaseVal, 0);
            const totalStk = variants.reduce((s, r) => s + r.stock, 0);
            const uid = productName.replace(/[^a-zA-Z0-9]/g, '_');
            return '<div class="bg-white border border-gray-200 rounded-xl overflow-hidden">' +
              '<div class="flex justify-between items-center px-3 py-3 cursor-pointer bg-gray-50 hover:bg-gray-100" onclick="var el=document.getElementById(\'stock_var_' + uid + '\'); el.classList.toggle(\'hidden\')">' +
              '<div class="font-bold text-green-800 text-sm">' + productName + '</div>' +
              '<div class="flex gap-4 items-center">' +
              '<span class="text-xs text-gray-500">Stock: <b>' + totalStk + '</b></span>' +
              '<span class="text-xs text-red-500">' + (totalPurVal > 0 ? fmt(totalPurVal) : '—') + '</span>' +
              '<span class="text-xs text-green-700 font-bold">' + fmt(totalSaleVal) + '</span>' +
              '<span class="text-gray-400 text-xs">▾</span>' +
              '</div></div>' +
              '<div id="stock_var_' + uid + '" class="hidden">' +
              '<table class="w-full text-xs"><thead><tr class="bg-green-50 text-gray-600"><th class="px-3 py-2 text-left">Size · Pack</th><th class="px-3 py-2 text-right">Stock</th><th class="px-3 py-2 text-right">Cost/box</th><th class="px-3 py-2 text-right">Sale/box</th><th class="px-3 py-2 text-right">Purchase Val</th><th class="px-3 py-2 text-right">Sale Val</th></tr></thead><tbody>' +
              variants.map(r =>
                '<tr class="border-t border-gray-100"><td class="px-3 py-2 text-gray-500">' + r.size + ' · ' + r.label + '</td>' +
                '<td class="px-3 py-2 text-right font-bold">' + r.stock + '</td>' +
                '<td class="px-3 py-2 text-right text-red-500">' + (r.avgCost > 0 ? fmt(r.avgCost) : '—') + '</td>' +
                '<td class="px-3 py-2 text-right text-green-600">' + fmt(r.salePrice) + '</td>' +
                '<td class="px-3 py-2 text-right text-red-500">' + (r.avgCost > 0 ? fmt(r.purchaseVal) : '—') + '</td>' +
                '<td class="px-3 py-2 text-right text-green-700 font-bold">' + fmt(r.saleVal) + '</td></tr>'
              ).join('') +
              '</tbody></table></div></div>';
          }).join('') +
        '</div>' +
        '<div class="bg-gray-800 text-white rounded-xl px-3 py-3 mt-3 flex justify-between items-center"><span class="font-bold text-sm">Total</span><div class="flex gap-4"><span class="text-xs text-red-300">' + fmt(totalPurchaseValue) + '</span><span class="text-xs text-green-300 font-bold">' + fmt(totalSaleValue) + '</span></div></div>';
      })()}
    </div>`;
}

async function loadSalesReport() {
  const from = document.getElementById('sales_from').value;
  const to = document.getElementById('sales_to').value;
  if (!from || !to) { alert('Please select both From and To dates!'); return; }
  const result = document.getElementById('sales_report_result');
  result.innerHTML = '<div class="text-center text-gray-400 py-6">Loading...</div>';

  const fromDT = from + 'T00:00:00+05:30';
  const toDT = to + 'T23:59:59+05:30';

  const { data: orders } = await db.from('orders').select('*, customers(name, phone)').gte('created_at', fromDT).lte('created_at', toDT);
  const orderIds = (orders || []).map(o => o.id);
  let orderItems = [];
  if (orderIds.length > 0) {
    const { data: items } = await db.from('order_items').select('*').in('order_id', orderIds);
    orderItems = items || [];
  }

  // By Product
  const byProduct = {};
  orderItems.forEach(item => {
    const key = (item.product_name || 'Unknown') + ' — ' + (item.variant_name || '');
    if (!byProduct[key]) byProduct[key] = { qty: 0, amount: 0 };
    byProduct[key].qty += item.quantity || 0;
    byProduct[key].amount += item.total_price || 0;
  });

  // By Customer
  const byCustomer = {};
  (orders || []).forEach(o => {
    const name = o.customers?.name || 'Unknown';
    const phone = o.customers?.phone || '';
    const key = name + '||' + phone;
    if (!byCustomer[key]) byCustomer[key] = { name, phone, orders: 0, amount: 0 };
    byCustomer[key].orders += 1;
    byCustomer[key].amount += o.total_amount || 0;
  });

  // Group by product name, variants underneath
  const byProductGrouped = {};
  orderItems.forEach(item => {
    const name = item.product_name || 'Unknown';
    if (!byProductGrouped[name]) byProductGrouped[name] = { qty: 0, amount: 0, variants: {} };
    byProductGrouped[name].qty += item.quantity || 0;
    byProductGrouped[name].amount += item.total_price || 0;
    const vkey = item.variant_name || '-';
    if (!byProductGrouped[name].variants[vkey]) byProductGrouped[name].variants[vkey] = { qty: 0, amount: 0 };
    byProductGrouped[name].variants[vkey].qty += item.quantity || 0;
    byProductGrouped[name].variants[vkey].amount += item.total_price || 0;
  });

  const fmt = n => '₹' + (n || 0).toLocaleString('en-IN');
  const totalSales = (orders || []).reduce((s, o) => s + (o.total_amount || 0), 0);
  const productGroupRows = Object.entries(byProductGrouped).sort((a, b) => b[1].amount - a[1].amount);
  const customerRows = Object.entries(byCustomer).sort((a, b) => b[1].amount - a[1].amount);

  result.innerHTML = `
    <div class="bg-white rounded-xl shadow p-3 mb-4 text-center">
      <div class="text-xs text-gray-500">Total Sales (${from} to ${to})</div>
      <div class="font-bold text-green-700 text-2xl">${fmt(totalSales)}</div>
      <div class="text-xs text-gray-400">${(orders||[]).length} orders · ${orderItems.length} line items</div>
    </div>

    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <div class="font-bold text-gray-700 mb-3">🌿 By Product</div>
      ${productGroupRows.length === 0 ? '<div class="text-gray-400 text-center py-3">No data</div>' :
      '<div class="overflow-x-auto"><table class="w-full text-xs"><thead><tr class="bg-green-700 text-white"><th class="px-2 py-2 text-left">Product</th><th class="px-2 py-2 text-right">Qty Sold</th><th class="px-2 py-2 text-right">Amount</th></tr></thead><tbody>' +
      productGroupRows.map(([name, d]) =>
        '<tr class="bg-gray-100 border-b font-bold"><td class="px-2 py-2 text-green-800">' + name + '</td><td class="px-2 py-2 text-right">' + d.qty + '</td><td class="px-2 py-2 text-right text-green-700">' + fmt(d.amount) + '</td></tr>' +
        Object.entries(d.variants).map(([vname, vd]) =>
          '<tr class="border-b bg-white"><td class="px-2 py-2 text-gray-400 pl-5">↳ ' + vname + '</td><td class="px-2 py-2 text-right text-gray-500">' + vd.qty + '</td><td class="px-2 py-2 text-right text-gray-500">' + fmt(vd.amount) + '</td></tr>'
        ).join('')
      ).join('') +
      '<tfoot><tr class="bg-gray-800 text-white font-bold"><td class="px-2 py-2">Total</td><td class="px-2 py-2 text-right">' + productGroupRows.reduce((s,[,d])=>s+d.qty,0) + '</td><td class="px-2 py-2 text-right">' + fmt(totalSales) + '</td></tr></tfoot></table></div>'}
    </div>

    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <div class="font-bold text-gray-700 mb-3">👤 By Customer</div>
      ${customerRows.length === 0 ? '<div class="text-gray-400 text-center py-3">No data</div>' :
      '<div class="overflow-x-auto"><table class="w-full text-xs"><thead><tr class="bg-blue-700 text-white"><th class="px-2 py-2 text-left">Customer</th><th class="px-2 py-2 text-left">Phone</th><th class="px-2 py-2 text-right">Orders</th><th class="px-2 py-2 text-right">Amount</th></tr></thead><tbody>' +
      customerRows.map(([, d], i) => '<tr class="' + (i%2===0?'bg-white':'bg-gray-50') + ' border-b"><td class="px-2 py-2 font-medium">' + d.name + '</td><td class="px-2 py-2 text-gray-400">' + d.phone + '</td><td class="px-2 py-2 text-right">' + d.orders + '</td><td class="px-2 py-2 text-right font-bold text-blue-700">' + fmt(d.amount) + '</td></tr>').join('') +
      '<tfoot><tr class="bg-gray-800 text-white font-bold"><td colspan="2" class="px-2 py-2">Total</td><td class="px-2 py-2 text-right">' + (orders||[]).length + '</td><td class="px-2 py-2 text-right">' + fmt(totalSales) + '</td></tr></tfoot></table></div>'}
    </div>`;
}

  content.innerHTML = '<div class="text-center py-10 text-gray-400">Loading...</div>';

  if (tab === 'orders') {
    const { data: orders } = await db.from('orders').select('*, customers(name, phone)').order('created_at', { ascending: false });
    const { data: items } = await db.from('order_items').select('*');
    window._allOrders = orders || [];
    window._allItems = items || [];
    renderOrdersTab('pending');
    return;

  } else if (tab === 'products') {

    const { data: variants } = await db.from('product_variants').select('*');
    const { data: packagings } = await db.from('product_packagings').select('*');

function filterCreditCards() {
  const search = (document.getElementById('credit_search')?.value || '').toLowerCase();
  const cards = document.querySelectorAll('#credit_cards_list .bg-white');
  cards.forEach(card => {
    const text = card.innerText.toLowerCase();
    card.style.display = text.includes(search) ? 'block' : 'none';
  });
}

async function loadOrderPL(orders, orderItems, products) {
  const fmt = n => '₹' + (n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });

  // Build cost price lookup: "productname||variantsize" -> cost_price
  const costMap = {};
  (products || []).forEach(p => {
    (p.product_variants || []).forEach(v => {
      (v.product_packagings || []).forEach(pk => {
        const key = (p.name || '').toLowerCase() + '||' + (v.bag_size || '').toLowerCase();
        if (!costMap[key]) costMap[key] = pk.cost_price || 0;
      });
    });
  });

  const orderRows = (orders || []).map(o => {
    const items = (orderItems || []).filter(i => i.order_id === o.id);
    let totalCost = 0;
    let costKnown = true;
    items.forEach(item => {
      const key = (item.product_name || '').toLowerCase() + '||' + (item.variant_name || '').toLowerCase();
      const cost = costMap[key];
      if (cost === undefined || cost === 0) costKnown = false;
      totalCost += (cost || 0) * (item.quantity || 0);
    });
    const sale = o.total_amount || 0;
    const profit = sale - totalCost;
    const margin = sale > 0 ? ((profit / sale) * 100).toFixed(1) : 0;
    return { o, items, sale, totalCost, profit, margin, costKnown };
  });

  const totalSale = orderRows.reduce((s, r) => s + r.sale, 0);
  const totalCost = orderRows.reduce((s, r) => s + r.totalCost, 0);
  const totalProfit = totalSale - totalCost;
  const overallMargin = totalSale > 0 ? ((totalProfit / totalSale) * 100).toFixed(1) : 0;

  return `
    <div class="bg-white rounded-xl shadow p-4 mt-4">
      <div class="font-bold text-gray-700 mb-1">🧾 Order-wise P&L</div>
      <div class="text-xs text-gray-400 mb-3">Cost = cost price per box × quantity sold</div>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="bg-green-50 rounded-lg p-3 text-center">
          <div class="text-xs text-gray-400">Total Sale</div>
          <div class="font-bold text-green-700">${fmt(totalSale)}</div>
        </div>
        <div class="bg-red-50 rounded-lg p-3 text-center">
          <div class="text-xs text-gray-400">Total Cost</div>
          <div class="font-bold text-red-600">${fmt(totalCost)}</div>
        </div>
        <div class="bg-gray-50 rounded-lg p-3 text-center">
          <div class="text-xs text-gray-400">Net Profit</div>
          <div class="font-bold ${totalProfit >= 0 ? 'text-green-700' : 'text-red-600'}">${fmt(totalProfit)}</div>
          <div class="text-xs text-gray-400">Margin: ${overallMargin}%</div>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-xs border-collapse">
          <thead>
            <tr class="bg-gray-800 text-white">
              <th class="px-2 py-2 text-left">Date</th>
              <th class="px-2 py-2 text-left">Customer</th>
              <th class="px-2 py-2 text-left">Items</th>
              <th class="px-2 py-2 text-right">Sale</th>
              <th class="px-2 py-2 text-right">Cost</th>
              <th class="px-2 py-2 text-right">Profit</th>
              <th class="px-2 py-2 text-right">Margin</th>
            </tr>
          </thead>
          <tbody>
            ${orderRows.length === 0 ? '<tr><td colspan="7" class="text-center py-6 text-gray-400">No orders in this period</td></tr>' :
            orderRows.map((r, i) => `
              <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} border-b">
                <td class="px-2 py-2 text-gray-500 whitespace-nowrap">${new Date(r.o.created_at).toLocaleDateString('en-IN')}</td>
                <td class="px-2 py-2 font-medium">${r.o.customers?.name || 'Unknown'}</td>
                <td class="px-2 py-2 text-gray-400" style="max-width:160px;word-break:break-word;">${r.items.map(it => (it.product_name || '') + ' x' + it.quantity).join(', ')}</td>
                <td class="px-2 py-2 text-right text-green-700 font-bold">${fmt(r.sale)}</td>
                <td class="px-2 py-2 text-right text-red-500">${r.totalCost > 0 ? fmt(r.totalCost) : '<span class="text-gray-300">—</span>'}</td>
                <td class="px-2 py-2 text-right font-bold ${r.profit >= 0 ? 'text-green-700' : 'text-red-600'}">${r.totalCost > 0 ? fmt(r.profit) : '<span class="text-gray-300">—</span>'}</td>
                <td class="px-2 py-2 text-right ${r.profit >= 0 ? 'text-green-600' : 'text-red-500'}">${r.totalCost > 0 ? r.margin + '%' : '—'}</td>
              </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr class="bg-gray-800 text-white font-bold">
              <td colspan="3" class="px-2 py-2">Total</td>
              <td class="px-2 py-2 text-right">${fmt(totalSale)}</td>
              <td class="px-2 py-2 text-right">${fmt(totalCost)}</td>
              <td class="px-2 py-2 text-right ${totalProfit >= 0 ? 'text-green-400' : 'text-red-400'}">${fmt(totalProfit)}</td>
              <td class="px-2 py-2 text-right">${overallMargin}%</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>`;
}

async function loadGSTR1Report() {
  const from = document.getElementById('gstr1_from').value;
  const to = document.getElementById('gstr1_to').value;
  const gstPct = parseFloat(document.getElementById('gstr1_gst_pct').value) || 18;
  if (!from || !to) { alert('Please select both From and To dates!'); return; }
  const result = document.getElementById('gstr1_result');
  result.innerHTML = '<div class="text-center text-gray-400 py-6">Loading...</div>';

  const fromDT = from + 'T00:00:00+05:30';
  const toDT = to + 'T23:59:59+05:30';

  const { data: orders } = await db.from('orders').select('*, customers(name, phone, gst_number, address)').gte('created_at', fromDT).lte('created_at', toDT).order('created_at');

  const gstRate = gstPct / 100;
  const taxableRate = 1 / (1 + gstRate);

  const b2b = (orders || []).filter(o => o.customers?.gst_number);
  const b2c = (orders || []).filter(o => !o.customers?.gst_number);

  const calcTax = (amount, isIGST) => {
    const taxable = amount * taxableRate;
    const totalGST = amount - taxable;
    return isIGST
      ? { taxable, igst: totalGST, cgst: 0, sgst: 0 }
      : { taxable, igst: 0, cgst: totalGST / 2, sgst: totalGST / 2 };
  };

  const isIGST = o => {
    const addr = (o.customers?.address || o.shipping_address || '').toLowerCase();
    return addr.includes('igst') || (o.gst_number && o.gst_number.substring(0, 2) !== '36');
  };

  const fmt = n => '₹' + (n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  const fmtN = n => (n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });

  let b2bTaxable = 0, b2bIGST = 0, b2bCGST = 0, b2bSGST = 0;
  let b2cTaxable = 0, b2cIGST = 0, b2cCGST = 0, b2cSGST = 0;

  const b2bRows = b2b.map((o, i) => {
    const interstate = isIGST(o);
    const t = calcTax(o.total_amount || 0, interstate);
    b2bTaxable += t.taxable; b2bIGST += t.igst; b2bCGST += t.cgst; b2bSGST += t.sgst;
    return `<tr class="${i%2===0?'bg-white':'bg-gray-50'} border-b text-xs">
      <td class="px-2 py-2">${new Date(o.created_at).toLocaleDateString('en-IN')}</td>
      <td class="px-2 py-2 font-medium">${o.customers?.name||'-'}</td>
      <td class="px-2 py-2 text-blue-600 font-mono">${o.customers?.gst_number||'-'}</td>
      <td class="px-2 py-2 text-right">${fmt(t.taxable)}</td>
      <td class="px-2 py-2 text-right text-purple-600">${t.igst > 0 ? fmt(t.igst) : '—'}</td>
      <td class="px-2 py-2 text-right text-blue-600">${t.cgst > 0 ? fmt(t.cgst) : '—'}</td>
      <td class="px-2 py-2 text-right text-green-600">${t.sgst > 0 ? fmt(t.sgst) : '—'}</td>
      <td class="px-2 py-2 text-right font-bold text-gray-700">${fmt(o.total_amount)}</td>
    </tr>`;
  });

  const b2cRows = b2c.map((o, i) => {
    const t = calcTax(o.total_amount || 0, false);
    b2cTaxable += t.taxable; b2cCGST += t.cgst; b2cSGST += t.sgst;
    return `<tr class="${i%2===0?'bg-white':'bg-gray-50'} border-b text-xs">
      <td class="px-2 py-2">${new Date(o.created_at).toLocaleDateString('en-IN')}</td>
      <td class="px-2 py-2 font-medium">${o.customers?.name||'-'}</td>
      <td class="px-2 py-2 text-gray-400">${o.customers?.phone||'-'}</td>

async function loadGSTR3BReport() {
  const month = document.getElementById('gstr3b_month').value;
  const gstPct = parseFloat(document.getElementById('gstr3b_gst_pct').value) || 18;
  if (!month) { alert('Please select a month!'); return; }
  const result = document.getElementById('gstr3b_result');
  result.innerHTML = '<div class="text-center text-gray-400 py-6">Loading...</div>';

  const fromDT = month + '-01T00:00:00+05:30';
  const lastDay = new Date(parseInt(month.split('-')[0]), parseInt(month.split('-')[1]), 0).getDate();
  const toDT = month + '-' + String(lastDay).padStart(2,'0') + 'T23:59:59+05:30';
  const fromDate = month + '-01';
  const toDate = month + '-' + String(lastDay).padStart(2,'0');

  const [{ data: orders }, { data: purchaseItems }] = await Promise.all([
    db.from('orders').select('total_amount, gst_number, customers(gst_number)').gte('created_at', fromDT).lte('created_at', toDT),
    db.from('purchase_items').select('quantity, unit_price, gst_percent, total_price, purchase_id'),
  ]);

  const allPurchases = await db.from('purchases').select('id, created_at').gte('created_at', fromDT).lte('created_at', toDT);
  const purchaseIdsInMonth = new Set((allPurchases.data || []).map(p => p.id));
  const monthPurchaseItems = (purchaseItems || []).filter(i => purchaseIdsInMonth.has(i.purchase_id));

  const gstRate = gstPct / 100;
  const taxableRate = 1 / (1 + gstRate);

  let outIGST = 0, outCGST = 0, outSGST = 0, outTaxable = 0;
  (orders || []).forEach(o => {
    const amount = o.total_amount || 0;
    const taxable = amount * taxableRate;
    const totalGST = amount - taxable;
    const hasGSTIN = o.customers?.gst_number || o.gst_number;
    outTaxable += taxable;
    if (hasGSTIN) { outIGST += totalGST; }
    else { outCGST += totalGST / 2; outSGST += totalGST / 2; }
  });

  let itcIGST = 0, itcCGST = 0, itcSGST = 0, itcTaxable = 0;
  monthPurchaseItems.forEach(item => {
    const baseAmount = (item.quantity || 0) * (item.unit_price || 0);
    const gst = item.gst_percent || 0;
    const gstAmt = baseAmount * (gst / 100);
    itcTaxable += baseAmount;
    if (gst > 0) { itcCGST += gstAmt / 2; itcSGST += gstAmt / 2; }
  });

  const netIGST = Math.max(0, outIGST - itcIGST);
  const netCGST = Math.max(0, outCGST - itcCGST);
  const netSGST = Math.max(0, outSGST - itcSGST);
  const totalPayable = netIGST + netCGST + netSGST;
  const totalITC = itcIGST + itcCGST + itcSGST;
  const totalOutputTax = outIGST + outCGST + outSGST;

  const fmt = n => '₹' + (n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });

  result.innerHTML = `
    <div class="space-y-4">
      <div class="bg-white rounded-xl shadow p-4">
        <div class="font-bold text-gray-700 mb-3">📋 GSTR-3B — ${month} · GST @${gstPct}%</div>

        <div class="font-semibold text-sm text-green-700 mb-2">3.1 — Output Tax Liability (Sales)</div>
        <table class="w-full text-xs mb-4">
          <thead><tr class="bg-green-700 text-white"><th class="px-3 py-2 text-left">Description</th><th class="px-3 py-2 text-right">Taxable Value</th><th class="px-3 py-2 text-right">IGST</th><th class="px-3 py-2 text-right">CGST</th><th class="px-3 py-2 text-right">SGST</th></tr></thead>
          <tbody>
            <tr class="border-b bg-white"><td class="px-3 py-2">Outward Taxable Supplies</td><td class="px-3 py-2 text-right">${fmt(outTaxable)}</td><td class="px-3 py-2 text-right text-purple-600">${fmt(outIGST)}</td><td class="px-3 py-2 text-right text-blue-600">${fmt(outCGST)}</td><td class="px-3 py-2 text-right text-green-600">${fmt(outSGST)}</td></tr>
            <tr class="bg-gray-800 text-white font-bold"><td class="px-3 py-2">Total Output Tax</td><td class="px-3 py-2 text-right">${fmt(outTaxable)}</td><td class="px-3 py-2 text-right">${fmt(outIGST)}</td><td class="px-3 py-2 text-right">${fmt(outCGST)}</td><td class="px-3 py-2 text-right">${fmt(outSGST)}</td></tr>
          </tbody>
        </table>

        <div class="font-semibold text-sm text-blue-700 mb-2">4 — Input Tax Credit (Purchases)</div>
        <table class="w-full text-xs mb-4">
          <thead><tr class="bg-blue-700 text-white"><th class="px-3 py-2 text-left">Description</th><th class="px-3 py-2 text-right">Taxable Value</th><th class="px-3 py-2 text-right">IGST</th><th class="px-3 py-2 text-right">CGST</th><th class="px-3 py-2 text-right">SGST</th></tr></thead>
          <tbody>
            <tr class="border-b bg-white"><td class="px-3 py-2">ITC Available (Inputs)</td><td class="px-3 py-2 text-right">${fmt(itcTaxable)}</td><td class="px-3 py-2 text-right text-purple-600">${fmt(itcIGST)}</td><td class="px-3 py-2 text-right text-blue-600">${fmt(itcCGST)}</td><td class="px-3 py-2 text-right text-green-600">${fmt(itcSGST)}</td></tr>
            <tr class="bg-gray-800 text-white font-bold"><td class="px-3 py-2">Total ITC</td><td class="px-3 py-2 text-right">${fmt(itcTaxable)}</td><td class="px-3 py-2 text-right">${fmt(itcIGST)}</td><td class="px-3 py-2 text-right">${fmt(itcCGST)}</td><td class="px-3 py-2 text-right">${fmt(itcSGST)}</td></tr>
          </tbody>
        </table>

        <div class="font-semibold text-sm text-red-700 mb-2">Net Tax Payable</div>
        <table class="w-full text-xs mb-2">
          <thead><tr class="bg-red-700 text-white"><th class="px-3 py-2 text-left">Head</th><th class="px-3 py-2 text-right">Output Tax</th><th class="px-3 py-2 text-right">ITC</th><th class="px-3 py-2 text-right">Net Payable</th></tr></thead>
          <tbody>
            <tr class="border-b bg-white"><td class="px-3 py-2">IGST</td><td class="px-3 py-2 text-right">${fmt(outIGST)}</td><td class="px-3 py-2 text-right text-green-600">- ${fmt(itcIGST)}</td><td class="px-3 py-2 text-right font-bold text-red-600">${fmt(netIGST)}</td></tr>
            <tr class="border-b bg-gray-50"><td class="px-3 py-2">CGST</td><td class="px-3 py-2 text-right">${fmt(outCGST)}</td><td class="px-3 py-2 text-right text-green-600">- ${fmt(itcCGST)}</td><td class="px-3 py-2 text-right font-bold text-red-600">${fmt(netCGST)}</td></tr>
            <tr class="border-b bg-white"><td class="px-3 py-2">SGST</td><td class="px-3 py-2 text-right">${fmt(outSGST)}</td><td class="px-3 py-2 text-right text-green-600">- ${fmt(itcSGST)}</td><td class="px-3 py-2 text-right font-bold text-red-600">${fmt(netSGST)}</td></tr>
            <tr class="bg-gray-800 text-white font-bold"><td class="px-3 py-2">Total</td><td class="px-3 py-2 text-right">${fmt(totalOutputTax)}</td><td class="px-3 py-2 text-right">- ${fmt(totalITC)}</td><td class="px-3 py-2 text-right text-yellow-300 text-base">${fmt(totalPayable)}</td></tr>
          </tbody>
        </table>
        <div class="text-center mt-3 bg-red-50 border border-red-200 rounded-xl p-3">
          <div class="text-xs text-gray-500">Total GST Payable for ${month}</div>
          <div class="font-bold text-2xl text-red-600">${fmt(totalPayable)}</div>
        </div>
      </div>
    </div>`;
}
  
async function loadBalanceSheet() {
  const result = document.getElementById('bs_result');
  if (!result) return;
  result.innerHTML = '<div class="text-center text-gray-400 py-6">Loading...</div>';

  const [
    { data: cbLedger },
    { data: products },
    { data: creditSummary },
    { data: supplierLedger },
    { data: fixedAssets },
    { data: loans },
    { data: purchases },
    { data: purchaseItems },
  ] = await Promise.all([
    db.from('cash_bank_ledger').select('*').order('created_at', { ascending: false }),
    db.from('products').select('*, product_variants(*, product_packagings(*))'),
    db.from('credit_summary').select('*'),
    db.from('supplier_ledger').select('*'),
    db.from('fixed_assets').select('*').order('created_at'),
    db.from('loans').select('*').order('created_at'),
    db.from('purchases').select('id'),
    db.from('purchase_items').select('*'),
  ]);

  // Cash & Bank
  const cashLedger = (cbLedger || []).filter(l => l.account_type === 'cash');
  const bankLedger = (cbLedger || []).filter(l => l.account_type === 'bank');
  const cashBalance = cashLedger.length > 0 ? cashLedger[0].running_balance : 0;
  const bankBalance = bankLedger.length > 0 ? bankLedger[0].running_balance : 0;

  // Stock Value (sale price × stock)
  let stockValue = 0;
  (products || []).forEach(p => {
    (p.product_variants || []).forEach(v => {
      (v.product_packagings || []).forEach(pk => {
        stockValue += (pk.price_per_box || 0) * (pk.stock_quantity || 0);
      });
    });
  });

  // Receivables (customer outstanding)
  const totalReceivables = (creditSummary || []).reduce((s, c) => s + (c.balance > 0 ? c.balance : 0), 0);

  // Fixed Assets total
  const totalFixedAssets = (fixedAssets || []).reduce((s, a) => s + (a.value || 0), 0);

  // Total Assets
  const totalAssets = cashBalance + bankBalance + stockValue + totalReceivables + totalFixedAssets;

  // Supplier Payables
  const supplierMap = {};
  (supplierLedger || []).forEach(l => {
    if (!supplierMap[l.supplier_id]) supplierMap[l.supplier_id] = 0;
    supplierMap[l.supplier_id] += l.type === 'debit' ? l.amount : -l.amount;
  });
  const totalSupplierPayables = Object.values(supplierMap).reduce((s, v) => s + (v > 0 ? v : 0), 0);

  // Loans total
  const totalLoans = (loans || []).reduce((s, l) => s + (l.amount || 0), 0);

  // Total Liabilities
  const totalLiabilities = totalSupplierPayables + totalLoans;

  // Net Worth
  const netWorth = totalAssets - totalLiabilities;

  const fmt = n => '₹' + (n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });
  const today = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

  result.innerHTML = `

      <!-- ASSETS -->
      <div class="bg-white rounded-xl shadow overflow-hidden">

          <div class="font-bold">📈 Assets</div>
          <div class="font-bold text-lg">${fmt(totalAssets)}</div>
        </div>
        <div id="bs_assets">
          <table class="w-full text-sm">
            <tbody>
              <tr class="border-b"><td class="px-4 py-3 text-gray-600">💵 Cash in Hand</td><td class="px-4 py-3 text-right font-bold text-green-700">${fmt(cashBalance)}</td></tr>
              <tr class="border-b bg-gray-50"><td class="px-4 py-3 text-gray-600">🏦 Bank Balance</td><td class="px-4 py-3 text-right font-bold text-green-700">${fmt(bankBalance)}</td></tr>
              <tr class="border-b"><td class="px-4 py-3 text-gray-600">📦 Stock Value</td><td class="px-4 py-3 text-right font-bold text-green-700">${fmt(stockValue)}</td></tr>
              <tr class="border-b bg-gray-50"><td class="px-4 py-3 text-gray-600">👥 Customer Receivables</td><td class="px-4 py-3 text-right font-bold text-green-700">${fmt(totalReceivables)}</td></tr>
              <tr class="border-b"><td class="px-4 py-3 text-gray-600 font-medium">🏗️ Fixed Assets</td><td class="px-4 py-3 text-right font-bold text-green-700">${fmt(totalFixedAssets)}</td></tr>
              ${(fixedAssets || []).map(a => `
                <tr class="border-b bg-green-50">
                  <td class="px-6 py-2 text-xs text-gray-500">↳ ${a.name}</td>
                  <td class="px-4 py-2 text-right text-xs text-green-600 flex items-center justify-end gap-2">
                    ${fmt(a.value)}
                    <button onclick="editFixedAsset('${a.id}','${a.name.replace(/'/g,"\\'")}',${a.value})" class="text-blue-400 ml-2">✏️</button>
                    <button onclick="deleteFixedAsset('${a.id}')" class="text-red-400">🗑</button>
                  </td>
                </tr>`).join('')}
              <tr class="bg-green-50">
                <td colspan="2" class="px-4 py-2">
                  <button onclick="toggleAddFixedAsset()" class="text-green-700 text-xs font-bold">+ Add Fixed Asset</button>
                  <div id="add_fixed_asset_form" class="hidden mt-2 flex gap-2">
                    <input id="fa_name" placeholder="Asset name" class="border rounded px-2 py-1 text-xs flex-1" />
                    <input id="fa_value" type="number" placeholder="Value ₹" class="border rounded px-2 py-1 text-xs w-28" />
                    <button onclick="saveFixedAsset()" class="bg-green-700 text-white px-3 py-1 rounded text-xs">Save</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- LIABILITIES -->
      <div class="bg-white rounded-xl shadow overflow-hidden">
        <div class="bg-red-700 text-white px-4 py-3 flex justify-between items-center cursor-pointer" onclick="document.getElementById('bs_liabilities').classList.toggle('hidden')">
          <div class="font-bold">📉 Liabilities</div>
          <div class="font-bold text-lg">${fmt(totalLiabilities)}</div>
        </div>
        <div id="bs_liabilities">
          <table class="w-full text-sm">
            <tbody>
              <tr class="border-b"><td class="px-4 py-3 text-gray-600">🏢 Supplier Payables</td><td class="px-4 py-3 text-right font-bold text-red-600">${fmt(totalSupplierPayables)}</td></tr>
              <tr class="border-b bg-gray-50"><td class="px-4 py-3 text-gray-600 font-medium">🏦 Loans / Borrowings</td><td class="px-4 py-3 text-right font-bold text-red-600">${fmt(totalLoans)}</td></tr>
              ${(loans || []).map(l => `

        </div>

    </div>`;
}

async function saveFixedAsset() {
  const name = document.getElementById('fa_name').value.trim();
  const value = parseFloat(document.getElementById('fa_value').value);
  if (!name || !value) { alert('Name and value are required!'); return; }
  const { error } = await db.from('fixed_assets').insert({ name, value });
  if (error) { alert('Error: ' + error.message); return; }
  alert('Fixed asset saved! ✅');
  loadBalanceSheet();
}

async function editFixedAsset(id, name, value) {
  const newName = prompt('Edit asset name:', name);
  if (!newName) return;
  const newValue = prompt('Edit value:', value);
  if (!newValue || isNaN(newValue)) return;
  await db.from('fixed_assets').update({ name: newName, value: parseFloat(newValue) }).eq('id', id);
  alert('Updated! ✅');
  loadBalanceSheet();
}

async function deleteFixedAsset(id) {
  if (!confirm('Delete this fixed asset?')) return;
  await db.from('fixed_assets').delete().eq('id', id);
  alert('Deleted! ✅');
  loadBalanceSheet();
}

    { data: purchases },
    { data: expenses },
    { data: cbLedger },
    { data: creditSummary },
    { data: supplierLedger },
    { data: fixedAssets },
    { data: loans },
  ] = await Promise.all([
    db.from('orders').select('total_amount'),
    db.from('purchases').select('total_amount'),
    db.from('expenses').select('amount'),
    db.from('cash_bank_ledger').select('*').order('created_at', { ascending: false }),
    db.from('credit_summary').select('*'),
    db.from('supplier_ledger').select('*'),
    db.from('fixed_assets').select('*'),
    db.from('loans').select('*'),
  ]);

  const cashLedger = (cbLedger || []).filter(l => l.account_type === 'cash');
  const bankLedger = (cbLedger || []).filter(l => l.account_type === 'bank');
  const cashBalance = cashLedger.length > 0 ? cashLedger[0].running_balance : 0;
  const bankBalance = bankLedger.length > 0 ? bankLedger[0].running_balance : 0;

  const totalSales = (orders || []).reduce((s, o) => s + (o.total_amount || 0), 0);
  const totalPurchases = (purchases || []).reduce((s, p) => s + (p.total_amount || 0), 0);
  const totalExpenses = (expenses || []).reduce((s, e) => s + (e.amount || 0), 0);
  const totalReceivables = (creditSummary || []).reduce((s, c) => s + (c.balance > 0 ? c.balance : 0), 0);

  const supplierMap = {};
  (supplierLedger || []).forEach(l => {
    if (!supplierMap[l.supplier_id]) supplierMap[l.supplier_id] = 0;
    supplierMap[l.supplier_id] += l.type === 'debit' ? l.amount : -l.amount;
  });
  const totalSupplierPayables = Object.values(supplierMap).reduce((s, v) => s + (v > 0 ? v : 0), 0);
  const totalFixedAssets = (fixedAssets || []).reduce((s, a) => s + (a.value || 0), 0);
  const totalLoans = (loans || []).reduce((s, l) => s + (l.amount || 0), 0);

  const fmt = n => '₹' + (n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });

  const entries = [
    { account: 'Sales Revenue', debit: 0, credit: totalSales },
    { account: 'Purchases / COGS', debit: totalPurchases, credit: 0 },
    { account: 'Expenses', debit: totalExpenses, credit: 0 },
    { account: 'Cash in Hand', debit: cashBalance, credit: 0 },
    { account: 'Bank Balance', debit: bankBalance, credit: 0 },
    { account: 'Customer Receivables', debit: totalReceivables, credit: 0 },
    { account: 'Supplier Payables', debit: 0, credit: totalSupplierPayables },
    { account: 'Fixed Assets', debit: totalFixedAssets, credit: 0 },
    { account: 'Loans / Borrowings', debit: 0, credit: totalLoans },
  ];

  const totalDebit = entries.reduce((s, e) => s + e.debit, 0);
  const totalCredit = entries.reduce((s, e) => s + e.credit, 0);
  const diff = totalDebit - totalCredit;
  if (diff > 0) entries.push({ account: 'Net Profit (Balancing)', debit: 0, credit: diff });
  else if (diff < 0) entries.push({ account: 'Net Loss (Balancing)', debit: Math.abs(diff), credit: 0 });

  const finalDebit = entries.reduce((s, e) => s + e.debit, 0);
  const finalCredit = entries.reduce((s, e) => s + e.credit, 0);
  const today = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

  result.innerHTML = `
    <div class="bg-white rounded-xl shadow p-4">
      <div class="font-bold text-gray-700 mb-1">⚖️ Trial Balance — as of ${today}</div>
      <div class="text-xs text-gray-400 mb-4">All figures are cumulative from the beginning</div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr class="bg-gray-800 text-white">
              <th class="px-3 py-2 text-left">Account</th>
              <th class="px-3 py-2 text-right">Debit</th>
              <th class="px-3 py-2 text-right">Credit</th>
            </tr>
          </thead>
          <tbody>
            ${entries.map((e, i) => `
              <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} border-b">
                <td class="px-3 py-2 text-gray-700">${e.account}</td>
                <td class="px-3 py-2 text-right font-medium ${e.debit > 0 ? 'text-gray-800' : 'text-gray-300'}">${e.debit > 0 ? fmt(e.debit) : '—'}</td>
                <td class="px-3 py-2 text-right font-medium ${e.credit > 0 ? 'text-gray-800' : 'text-gray-300'}">${e.credit > 0 ? fmt(e.credit) : '—'}</td>
              </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr class="bg-gray-800 text-white font-bold">
              <td class="px-3 py-2">Total</td>
              <td class="px-3 py-2 text-right">${fmt(finalDebit)}</td>
              <td class="px-3 py-2 text-right">${fmt(finalCredit)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="mt-3 text-center text-xs ${finalDebit === finalCredit ? 'text-green-600' : 'text-red-500'} font-bold">
        ${finalDebit === finalCredit ? '✅ Trial Balance matches!' : '⚠️ Difference: ' + fmt(Math.abs(finalDebit - finalCredit))}
      </div>
    </div>`;
}
  
async function loadDashboard() {
  const content = document.getElementById('admin_content');
  if (!content) return;
  content.innerHTML = '<div class="text-center py-10 text-gray-400">Loading dashboard...</div>';

  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  const fromDT = todayStr + 'T00:00:00+05:30';
  const toDT = todayStr + 'T23:59:59+05:30';

  const [
    { data: todayOrders },
    { data: allOrders },
    { data: credits },
    { data: cbLedger },
    { data: products },
    { data: purchases },
    { data: purchaseItemsAll },
  ] = await Promise.all([
    db.from('orders').select('*, customers(name,phone)').gte('created_at', fromDT).lte('created_at', toDT),
    db.from('orders').select('order_status, total_amount'),
    db.from('credit_summary').select('*'),
    db.from('cash_bank_ledger').select('*').order('created_at', { ascending: false }),
    db.from('products').select('*, product_variants(*, product_packagings(*))'),
    db.from('purchases').select('created_at, total_amount').gte('created_at', fromDT).lte('created_at', toDT),
    db.from('purchase_items').select('product_name, exp_date, batch_number, size').not('exp_date', 'is', null),
  ]);

  const todaySales = (todayOrders || []).reduce((s, o) => s + (o.total_amount || 0), 0);
  const todayPurchases = (purchases || []).reduce((s, p) => s + (p.total_amount || 0), 0);
  const pendingOrders = (allOrders || []).filter(o => o.order_status === 'pending').length;
  const totalOutstanding = (credits || []).reduce((s, c) => s + (c.balance > 0 ? c.balance : 0), 0);
  const cashLedger = (cbLedger || []).filter(l => l.account_type === 'cash');
  const bankLedger = (cbLedger || []).filter(l => l.account_type === 'bank');
  const cashBal = cashLedger.length > 0 ? cashLedger[0].running_balance : 0;
  const bankBal = bankLedger.length > 0 ? bankLedger[0].running_balance : 0;

  // Low stock alerts
  const lowStock = [];
  const expiring = [];
  const now = new Date();
  (products || []).forEach(p => {
    (p.product_variants || []).forEach(v => {
      (v.product_packagings || []).forEach(pk => {
        if ((pk.stock_quantity || 0) <= 5 && (pk.stock_quantity || 0) > 0) {
          lowStock.push({ name: p.name, size: v.bag_size, label: pk.box_label, stock: pk.stock_quantity });
        }
        if ((pk.stock_quantity || 0) === 0) {
          lowStock.push({ name: p.name, size: v.bag_size, label: pk.box_label, stock: 0, outOfStock: true });
        }
      });
    });
  });

  // Expiry alerts
  const today30 = new Date(); today30.setDate(today30.getDate() + 30);
  const today60 = new Date(); today60.setDate(today60.getDate() + 60);
  const today90 = new Date(); today90.setDate(today90.getDate() + 90);
  const expiryAlerts = (purchaseItemsAll || []).filter(i => {
    if (!i.exp_date) return false;
    const parts = i.exp_date.split('/');
    let expDate;
    if (parts.length === 2) expDate = new Date(parseInt(parts[1]), parseInt(parts[0]) - 1, 1);
    else if (parts.length === 3) expDate = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    else expDate = new Date(i.exp_date);
    if (isNaN(expDate)) return false;
    i._expDate = expDate;
    return expDate <= today90 && expDate >= new Date();
  }).map(i => {
    const daysLeft = Math.floor((i._expDate - new Date()) / (1000 * 60 * 60 * 24));
    return { ...i, daysLeft };
  }).sort((a, b) => a.daysLeft - b.daysLeft);

  const overdueCredits = (credits || []).filter(c => c.balance > 0).sort((a, b) => b.balance - a.balance).slice(0, 5);
  const fmt = n => '₹' + (n || 0).toLocaleString('en-IN');
  const todayLabel = today.toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' });

  content.innerHTML = `
    <div class="space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <div class="text-xl font-bold text-gray-800">Good ${today.getHours() < 12 ? 'Morning' : today.getHours() < 17 ? 'Afternoon' : 'Evening'}! 🌿</div>
          <div class="text-xs text-gray-400">${todayLabel}</div>
        </div>
      </div>

      <!-- Today Stats -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-green-700 text-white rounded-xl p-4 shadow">
          <div class="text-xs text-green-200">Today's Sales</div>
          <div class="font-bold text-xl">${fmt(todaySales)}</div>
          <div class="text-xs text-green-200">${(todayOrders||[]).length} order(s)</div>
        </div>
        <div class="bg-orange-500 text-white rounded-xl p-4 shadow">
          <div class="text-xs text-orange-100">Pending Orders</div>
          <div class="font-bold text-xl">${pendingOrders}</div>
          <div class="text-xs text-orange-100">need attention</div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow border">
          <div class="text-xs text-gray-400">💵 Cash</div>
          <div class="font-bold text-orange-600">${fmt(cashBal)}</div>
          <div class="text-xs text-gray-400">🏦 Bank: ${fmt(bankBal)}</div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow border">
          <div class="text-xs text-gray-400">Outstanding</div>
          <div class="font-bold text-red-500">${fmt(totalOutstanding)}</div>
          <div class="text-xs text-gray-400">${(credits||[]).filter(c=>c.balance>0).length} customers</div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="bg-white rounded-xl shadow p-4">
        <div class="font-bold text-gray-700 mb-3">⚡ Quick Actions</div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="showAdminTab('orders')" class="bg-green-700 text-white py-3 rounded-xl text-sm font-bold">📦 View Orders</button>
          <button onclick="showAdminTab('orders'); setTimeout(()=>showCreateManualOrder(),300)" class="bg-blue-600 text-white py-3 rounded-xl text-sm font-bold">➕ New Order</button>
          <button onclick="showAdminTab('credit')" class="bg-orange-500 text-white py-3 rounded-xl text-sm font-bold">💳 Credit Ledger</button>
          <button onclick="showAdminTab('reports')" class="bg-purple-600 text-white py-3 rounded-xl text-sm font-bold">📊 Reports</button>
        </div>
      </div>

      <!-- Low Stock Alerts -->
      ${lowStock.length > 0 ? `
      <div class="bg-white rounded-xl shadow border-l-4 border-red-400 overflow-hidden">
        <div class="flex justify-between items-center px-4 py-3 cursor-pointer" onclick="document.getElementById('low_stock_list').classList.toggle('hidden'); this.querySelector('.toggle-arrow').textContent = document.getElementById('low_stock_list').classList.contains('hidden') ? '▾' : '▴'">
          <div class="font-bold text-red-600">⚠️ Stock Alerts (${lowStock.length})</div>
          <span class="toggle-arrow text-red-400 text-sm">▾</span>
        </div>
        <div id="low_stock_list" class="hidden px-4 pb-4 space-y-2">
          ${lowStock.slice(0, 8).map(s => `
            <div class="flex justify-between items-center text-sm border-b pb-1">
              <span class="text-gray-700">${s.name} · ${s.size} · ${s.label}</span>
              <span class="font-bold ${s.outOfStock ? 'text-red-600' : 'text-orange-500'}">${s.outOfStock ? '❌ Out' : '⚠️ ' + s.stock + ' left'}</span>
            </div>`).join('')}
          <button onclick="showAdminTab('reports')" class="mt-2 text-xs text-blue-600 underline">View Full Stock Report →</button>
        </div>
      </div>` : '<div class="bg-green-50 border border-green-200 rounded-xl p-4 text-green-700 text-sm font-medium text-center">✅ All products well stocked!</div>'}

      <!-- Expiry Alerts -->
      ${expiryAlerts.length > 0 ? `
      <div class="bg-white rounded-xl shadow border-l-4 border-yellow-400 overflow-hidden">
        <div class="flex justify-between items-center px-4 py-3 cursor-pointer" onclick="document.getElementById('expiry_list').classList.toggle('hidden'); this.querySelector('.expiry-arrow').textContent = document.getElementById('expiry_list').classList.contains('hidden') ? '▾' : '▴'">
          <div class="font-bold text-yellow-600">⏰ Expiring Soon (${expiryAlerts.length} batches)</div>
          <span class="expiry-arrow text-yellow-500 text-sm">▾</span>
        </div>
        <div id="expiry_list" class="hidden px-4 pb-4 space-y-2">
          ${expiryAlerts.slice(0, 6).map(e => `
            <div class="flex justify-between items-center text-sm border-b pb-1">
              <div>
                <div class="font-medium text-gray-700">${e.product_name}</div>
                <div class="text-xs text-gray-400">Batch: ${e.batch_number || '-'} · ${e.size || ''}</div>
              </div>
              <span class="font-bold text-xs px-2 py-1 rounded-full ${e.daysLeft <= 30 ? 'bg-red-100 text-red-600' : e.daysLeft <= 60 ? 'bg-orange-100 text-orange-600' : 'bg-yellow-100 text-yellow-600'}">${e.daysLeft}d left · Exp: ${e.exp_date}</span>
            </div>`).join('')}
        </div>
      </div>` : ''}

      <!-- Top Overdue Customers -->
      ${overdueCredits.length > 0 ? `
      <div class="bg-white rounded-xl shadow border-l-4 border-orange-400 overflow-hidden">
        <div class="flex justify-between items-center px-4 py-3 cursor-pointer" onclick="document.getElementById('pending_payments_list').classList.toggle('hidden'); this.querySelector('.pending-arrow').textContent = document.getElementById('pending_payments_list').classList.contains('hidden') ? '▾' : '▴'">
          <div class="font-bold text-orange-600">💳 Top Pending Payments (${overdueCredits.length})</div>
          <span class="pending-arrow text-orange-400 text-sm">▾</span>
        </div>
        <div id="pending_payments_list" class="hidden px-4 pb-4 space-y-2">
          ${overdueCredits.map(c => `
            <div class="flex justify-between items-center text-sm border-b pb-1">
              <div>
                <div class="font-medium">${c.name}</div>
                <div class="text-xs text-gray-400">${c.phone}</div>
              </div>
              <div class="text-right">
                <div class="font-bold text-red-500">${fmt(c.balance)}</div>
                <button onclick="shareWhatsApp('${c.phone}','${c.name.replace(/'/g,"\\'")}',${c.balance})" class="text-xs bg-green-500 text-white px-2 py-0.5 rounded-full mt-1">📲 WhatsApp</button>

      <!-- Today's Orders -->

          ${(todayOrders||[]).map(o => `
            <div class="flex justify-between items-center text-sm border-b pb-2">
              <div>

      </div>` : ''}

    </div>`;
}

async function shareWhatsApp(phone, customerName, balance) {
  const fmt = n => '₹' + (n || 0).toLocaleString('en-IN');
  const message = `Dear ${customerName},\n\nThis is a friendly reminder from *P.V.R Agrochemicals*.\n\nYour outstanding balance is *${fmt(balance)}*.\n\nKindly arrange the payment at your earliest convenience.\n\nThank you 🌿\n— PVR Agro Team\n📞 9573711019`;
  const encoded = encodeURIComponent(message);
  const cleanPhone = phone.replace(/\D/g, '');
  const wa = `https://wa.me/91${cleanPhone}?text=${encoded}`;
  window.open(wa, '_blank');
}

function renderCartBar() {
  const existing = document.getElementById('sticky_cart_bar');
  if (existing) existing.remove();
  if (state.page !== 'home' && state.page !== 'product') return;
  const count = state.cart.reduce((s, i) => s + i.qty, 0);
  if (count === 0) return;
  const total = cartTotal();
  const bar = document.createElement('div');
  bar.id = 'sticky_cart_bar';
  bar.className = 'fixed bottom-0 left-0 right-0 z-50 p-3';
  bar.innerHTML = `<button onclick="navigate('cart')" class="w-full bg-green-700 text-white rounded-2xl py-3 px-5 flex justify-between items-center shadow-xl">
    <div class="flex items-center gap-2">
      <span class="bg-white text-green-700 font-bold text-xs rounded-full w-6 h-6 flex items-center justify-center">${count}</span>
      <span class="font-bold text-sm">View Cart</span>
    </div>
    <span class="font-bold">₹${total.toLocaleString('en-IN')} →</span>
  </button>`;
  document.body.appendChild(bar);
}

function navigate(page) {
  state.page = page;
  render();
  if (page === 'home' || page === 'product') renderCartBar();
}
function attachEvents() {}
if (window.location.hash === '#admin') state.page = 'admin';
render();
hideSplash();
