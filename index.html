<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PVR Agro</title>
<link rel="manifest" id="manifest-placeholder" />
<meta name="theme-color" content="#15803d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PVR Agro" />
<link rel="apple-touch-icon" href="https://ipdjajuhfqmuuzjejlwn.supabase.co/storage/v1/object/public/product-images/pvr-logo.jpg" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .loading { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-gray-50">
<div id="splash" class="fixed inset-0 bg-green-700 flex flex-col items-center justify-center z-[999]">
  <img src="https://ipdjajuhfqmuuzjejlwn.supabase.co/storage/v1/object/public/product-images/pvr-logo.jpg" class="h-24 w-24 rounded-full border-4 border-white shadow-lg mb-4 object-cover" />
  <div class="text-white text-2xl font-bold mb-1">PVR Agro</div>
  <div class="text-green-200 text-sm mb-6">P.V.R Agrochemicals</div>
  <div class="flex gap-1">
    <div class="w-2 h-2 bg-white rounded-full animate-bounce" style="animation-delay:0s"></div>
    <div class="w-2 h-2 bg-white rounded-full animate-bounce" style="animation-delay:0.15s"></div>
    <div class="w-2 h-2 bg-white rounded-full animate-bounce" style="animation-delay:0.3s"></div>
  </div>
</div>
<div id="app"></div>
<div id="install_banner" class="hidden fixed bottom-0 left-0 right-0 bg-green-700 text-white p-3 flex items-center justify-between z-50 shadow-lg">
  <div>
    <div class="font-bold text-sm">Install PVR Agro</div>
    <div class="text-xs text-green-200">Add to home screen for quick access</div>
  </div>
  <div class="flex gap-2">
    <button onclick="installApp()" class="bg-white text-green-700 px-3 py-1 rounded-lg text-sm font-bold">Install</button>
    <button onclick="document.getElementById('install_banner').classList.add('hidden')" class="text-green-200 px-2 py-1 text-sm">✕</button>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://ipdjajuhfqmuuzjejlwn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwZGphanVoZnFtdXV6amVqbHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNDY2ODcsImV4cCI6MjA5MzYyMjY4N30.Y1w43s7vx2V_XkgYvSUB0xTIsnGGFWyCU09z_r_otEg';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);
const LOGO_URL = 'https://ipdjajuhfqmuuzjejlwn.supabase.co/storage/v1/object/public/product-images/pvr-logo.jpg';

// PWA Manifest
const manifest = {
  name: 'PVR Agro',
  short_name: 'PVR Agro',
  description: 'P.V.R Agrochemicals - Wholesale Agricultural Supplies',
  start_url: '/',
  display: 'standalone',
  background_color: '#ffffff',
  theme_color: '#15803d',
  orientation: 'portrait',
  icons: [
    { src: LOGO_URL, sizes: '192x192', type: 'image/jpeg' },
    { src: LOGO_URL, sizes: '512x512', type: 'image/jpeg' }
  ]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
const manifestUrl = URL.createObjectURL(manifestBlob);
document.getElementById('manifest-placeholder').setAttribute('href', manifestUrl);

// PWA Install
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install_banner').classList.remove('hidden');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install_banner').classList.add('hidden');
  deferredPrompt = null;
});
function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('install_banner').classList.add('hidden');
    });
  }
}

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(console.error);
}

// STATE
let state = {
  page: 'home',
  products: [],
  cart: JSON.parse(localStorage.getItem('pvr_cart') || '[]'),
  search: '',
  category: 'all',
  adminLoggedIn: false,
  loading: false,
  selectedProduct: null,
};

function saveCart() { localStorage.setItem('pvr_cart', JSON.stringify(state.cart)); }
function cartTotal() { return state.cart.reduce((sum, i) => sum + (i.pricePerBox * i.qty), 0); }

function hideSplash() {
  const splash = document.getElementById('splash');
  if (splash) { splash.style.opacity = '0'; splash.style.transition = 'opacity 0.4s'; setTimeout(() => splash.remove(), 400); }
}

function render() {
  const app = document.getElementById('app');
  if (state.page === 'admin' && !state.adminLoggedIn) { app.innerHTML = renderAdminLogin(); }
  else if (state.page === 'admin') { app.innerHTML = renderAdmin(); loadAdminData(); }
  else if (state.page === 'cart') { app.innerHTML = renderCart(); }
  else if (state.page === 'checkout') { app.innerHTML = renderCheckout(); }
  else if (state.page === 'track') { app.innerHTML = renderTrack(); }
  else if (state.page === 'confirmation') { app.innerHTML = renderConfirmation(); }
  else if (state.page === 'product') { app.innerHTML = renderProduct(); initProductPage(); }
  else { app.innerHTML = renderHome(); if (state.products.length === 0) loadProducts(); else renderProductGrid(); }
  attachEvents();
}

function renderNav() {
  const cartCount = state.cart.reduce((s, i) => s + i.qty, 0);
  return `
  <nav class="bg-green-700 text-white px-4 py-2 flex items-center justify-between sticky top-0 z-50 shadow">
    <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
      <img src="${LOGO_URL}" class="h-10 w-10 rounded-full object-cover border-2 border-white" onerror="this.style.display='none'" />
      <span class="font-bold text-lg">PVR Agro</span>
    </div>
    <div class="flex items-center gap-4">
      <span class="cursor-pointer text-sm hover:underline" onclick="navigate('track')">Track Order</span>
      <span class="cursor-pointer relative" onclick="navigate('cart')">
        🛒
        ${cartCount > 0 ? `<span class="absolute -top-2 -right-2 bg-yellow-400 text-black text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">${cartCount}</span>` : ''}
      </span>
    </div>
  </nav>`;
}

function getCategoryStyle(cat) {
  const styles = {
    'Bio-Pesticides': { bg: 'bg-green-100', icon: '🌿', color: 'text-green-700', border: 'border-green-200' },
    'Pesticides':     { bg: 'bg-yellow-100', icon: '🧪', color: 'text-yellow-700', border: 'border-yellow-200' },
    'Fungicides':     { bg: 'bg-purple-100', icon: '🍄', color: 'text-purple-700', border: 'border-purple-200' },
    'Seeds':          { bg: 'bg-lime-100', icon: '🌱', color: 'text-lime-700', border: 'border-lime-200' },
    'Fertilizers':    { bg: 'bg-orange-100', icon: '💧', color: 'text-orange-700', border: 'border-orange-200' },
    'Herbicides':     { bg: 'bg-teal-100', icon: '🌾', color: 'text-teal-700', border: 'border-teal-200' },
    'Weedicides':     { bg: 'bg-red-100', icon: '☘️', color: 'text-red-700', border: 'border-red-200' },
  };
  return styles[cat] || { bg: 'bg-gray-100', icon: '📦', color: 'text-gray-700', border: 'border-gray-200' };
}

function renderPlaceholder(cat, h = 'h-28') {
  const s = getCategoryStyle(cat);
  return `<div class="w-full ${h} ${s.bg} border ${s.border} rounded-lg flex flex-col items-center justify-center gap-1">
    <span class="text-4xl">${s.icon}</span>
    <span class="text-xs font-medium ${s.color}">${cat}</span>
  </div>`;
}

function renderHome() {
  const categories = ['all','Bio-Pesticides','Pesticides','Fungicides','Seeds','Fertilizers','Herbicides','Weedicides'];
  const filtered = state.products.filter(p => {
    const matchCat = state.category === 'all' || p.category === state.category;
    const matchSearch = p.name.toLowerCase().includes(state.search.toLowerCase()) ||
      (p.chemical_name && p.chemical_name.toLowerCase().includes(state.search.toLowerCase())) ||
      (p.company_name && p.company_name.toLowerCase().includes(state.search.toLowerCase()));
    return matchCat && matchSearch;
  });
  return `
  ${renderNav()}
  <div class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex gap-2 mb-4">
      <input id="searchInput" type="text" placeholder="Search products..." value="${state.search}"
        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-green-500" />
      <button onclick="state.search=document.getElementById('searchInput').value; renderProductGrid();"
        class="bg-green-700 text-white px-4 py-2 rounded-lg font-medium">Search</button>
      <button onclick="state.search=''; renderProductGrid();"
        class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-medium">Clear</button>
    </div>
    <div class="mb-4 flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
      ${categories.map(c => {
        const s = getCategoryStyle(c);
        const active = state.category === c;
        return `<button onclick="state.category='${c}'; renderProductGrid();"
          class="flex-shrink-0 px-3 py-1.5 rounded-full text-sm font-medium border transition
          ${active ? 'bg-green-700 text-white border-green-700' : 'bg-white text-gray-600 border-gray-300'}">
          ${c === 'all' ? '🌾 All' : s.icon + ' ' + c}
        </button>`;
      }).join('')}
    </div>
    <div class="flex justify-end mb-3">
      <select onchange="state.sort=this.value; renderProductGrid();"
        class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-green-500 bg-white text-gray-600">
        <option value="name" ${state.sort === 'name' ? 'selected' : ''}>A–Z</option>
        <option value="price_asc" ${state.sort === 'price_asc' ? 'selected' : ''}>Price: Low to High</option>
        <option value="price_desc" ${state.sort === 'price_desc' ? 'selected' : ''}>Price: High to Low</option>
      </select>
    </div>
    ${state.loading ? '<div class="text-center py-10 text-gray-500">Loading products...</div>' : ''}
    <div id="product_grid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
  </div>`;
}

function renderProduct() {
  const product = state.products.find(p => p.id === state.selectedProduct);
  if (!product) return `${renderNav()}<div class="p-8 text-center">Product not found</div>`;
  const variants = product.variants || [];
  return `
  ${renderNav()}
  <div class="max-w-xl mx-auto px-4 py-6">
    <button onclick="navigate('home')" class="text-green-700 mb-4 flex items-center gap-1">← Back</button>
    <div class="bg-white rounded-xl shadow p-4">
      <div class="w-full rounded-xl mb-4 overflow-hidden">
        ${product.image_url ? `<img src="${product.image_url}" class="w-full h-full object-cover" />` : renderPlaceholder(product.category, 'h-48')}
      </div>
      <h1 class="text-xl font-bold text-gray-800">${product.name}</h1>
      ${product.company_name ? `<p class="text-sm text-gray-500">${product.company_name}</p>` : ''}
      ${product.chemical_name ? `<p class="text-xs text-blue-400 mb-1">${product.chemical_name}</p>` : ''}
      <p class="text-sm text-gray-600 mb-4">${product.description || ''}</p>
      ${variants.length > 0 ? `
      <div class="mb-3">
        <label class="text-sm font-semibold text-gray-700 mb-1 block">Select Size</label>
        <select id="variant_select" onchange="updatePackagings('${product.id}')"
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-green-500">
          ${variants.map(v => `<option value="${v.id}">${v.bag_size}</option>`).join('')}
        </select>
      </div>
      <div id="packaging_section"></div>
      ` : '<div class="text-gray-400 text-sm">No variants available</div>'}
    </div>
  </div>`;
}

function initProductPage() {
  const product = state.products.find(p => p.id === state.selectedProduct);
  if (!product || !product.variants || product.variants.length === 0) return;
  updatePackagings(product.id);
}

function updatePackagings(productId) {
  const product = state.products.find(p => p.id === productId);
  if (!product) return;
  const variantId = document.getElementById('variant_select')?.value;
  const variant = product.variants.find(v => v.id === variantId);
  const section = document.getElementById('packaging_section');
  if (!section || !variant) return;
  const packagings = variant.packagings || [];
  if (packagings.length === 0) {
    section.innerHTML = '<div class="text-gray-400 text-sm py-2">No packaging options available</div>';
    return;
  }
  section.innerHTML = `
    <div class="mb-3">
      <label class="text-sm font-semibold text-gray-700 mb-1 block">Select Packaging</label>
      <select id="packaging_select" onchange="updatePackagingDetails('${productId}','${variantId}')"
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-green-500">
        ${packagings.map(pk => `<option value="${pk.id}">${pk.box_label} (${pk.units_per_box} units)</option>`).join('')}
      </select>
    </div>
    <div id="packaging_details"></div>`;
  updatePackagingDetails(productId, variantId);
}

function updatePackagingDetails(productId, variantId) {
  const product = state.products.find(p => p.id === productId);
  const variant = product?.variants.find(v => v.id === variantId);
  const pkgId = document.getElementById('packaging_select')?.value;
  const pkg = (variant?.packagings || []).find(pk => pk.id === pkgId);
  const details = document.getElementById('packaging_details');
  if (!details || !pkg) return;
  details.innerHTML = `
    <div class="border border-gray-200 rounded-lg p-4 mb-3 bg-gray-50">
      <div class="font-semibold text-gray-800 mb-1">${pkg.box_label}</div>
      <div class="text-xs text-gray-500 mb-3">${pkg.units_per_box} units per box</div>
      <div class="grid grid-cols-3 gap-2 mb-3">
        <div class="bg-white rounded-lg p-2 text-center border">
          <div class="text-xs text-gray-400">MRP/unit</div>
          <div class="text-gray-600 text-sm">₹${pkg.mrp_per_unit || '-'}</div>
        </div>
        <div class="bg-white rounded-lg p-2 text-center border border-green-200">
          <div class="text-xs text-gray-500">Billing/unit</div>
          <div class="text-green-700 font-bold text-sm">₹${pkg.price_per_unit || '-'}</div>
        </div>
        <div class="bg-white rounded-lg p-2 text-center border border-blue-200">
          <div class="text-xs text-gray-500">Price/box</div>
          <div class="text-blue-700 font-bold text-sm">₹${pkg.price_per_box}</div>
        </div>
      </div>
      <div class="text-xs ${pkg.stock_quantity > 0 ? 'text-gray-400' : 'text-red-500'} mb-3">
        ${pkg.stock_quantity > 0 ? 'Stock: ' + pkg.stock_quantity + ' boxes available' : 'Out of Stock'}
      </div>
      <div class="flex items-center gap-3">
        <button onclick="document.getElementById('box_qty').stepDown()" class="w-8 h-8 bg-gray-200 rounded-full font-bold text-lg">-</button>
        <input type="number" id="box_qty" value="1" min="1" max="${pkg.stock_quantity}"
          class="w-16 text-center border rounded-lg py-1 text-sm" />
        <button onclick="document.getElementById('box_qty').stepUp()" class="w-8 h-8 bg-gray-200 rounded-full font-bold text-lg">+</button>
        <span class="text-sm text-gray-500">boxes</span>
      </div>
    </div>
    <button onclick="addToCartPkg('${productId}','${variantId}','${pkgId}')"
      ${pkg.stock_quantity === 0 ? 'disabled' : ''}
      class="w-full ${pkg.stock_quantity === 0 ? 'bg-gray-300 cursor-not-allowed' : 'bg-green-700 hover:bg-green-800'} text-white py-3 rounded-xl font-bold text-lg">
      ${pkg.stock_quantity === 0 ? 'Out of Stock' : 'Add to Cart 🛒'}
    </button>`;
}

function addToCartPkg(productId, variantId, pkgId) {
  const product = state.products.find(p => p.id === productId);
  const variant = product?.variants.find(v => v.id === variantId);
  const pkg = variant?.packagings.find(pk => pk.id === pkgId);
  if (!pkg) return;
  const qty = parseInt(document.getElementById('box_qty')?.value) || 1;
  if (qty > pkg.stock_quantity) { alert('Only ' + pkg.stock_quantity + ' boxes available!'); return; }
  const existing = state.cart.find(i => i.pkgId === pkgId);
  if (existing) { existing.qty += qty; }
  else {
    state.cart.push({
      productId, variantId, pkgId,
      name: product.name, size: variant.bag_size,
      boxLabel: pkg.box_label, unitsPerBox: pkg.units_per_box,
      pricePerUnit: pkg.price_per_unit, mrpPerUnit: pkg.mrp_per_unit,
      pricePerBox: pkg.price_per_box, qty,
    });
  }
  saveCart();
  alert(product.name + ' (' + variant.bag_size + ' · ' + pkg.box_label + ') x' + qty + ' added to cart! 🛒');
  render();
}

function renderCart() {
  return `
  ${renderNav()}
  <div class="max-w-xl mx-auto px-4 py-6">
    <h2 class="text-xl font-bold mb-4 text-gray-800">Your Cart</h2>
    ${state.cart.length === 0 ? `
      <div class="text-center py-10 text-gray-400">
        <div class="text-5xl mb-3">🛒</div>
        <div>Your cart is empty</div>
        <button onclick="navigate('home')" class="mt-4 bg-green-700 text-white px-6 py-2 rounded-lg">Shop Now</button>
      </div>` : `
      <div class="space-y-3 mb-6">
        ${state.cart.map((item, i) => `
          <div class="bg-white rounded-xl shadow-sm p-3 flex items-center gap-3">
            <div class="flex-1">
              <div class="font-semibold text-sm">${item.name}</div>
              <div class="text-xs text-gray-500">${item.size} · ${item.boxLabel}</div>
              <div class="text-green-700 font-bold">₹${item.pricePerBox}/box</div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="updateQty(${i},-1)" class="w-7 h-7 bg-gray-100 rounded-full font-bold">-</button>
              <span class="w-6 text-center">${item.qty}</span>
              <button onclick="updateQty(${i},1)" class="w-7 h-7 bg-gray-100 rounded-full font-bold">+</button>
            </div>
            <div class="text-right">
              <div class="font-bold text-sm">₹${item.pricePerBox * item.qty}</div>
              <div class="text-xs text-gray-400">${item.qty} box(es)</div>
            </div>
            <button onclick="removeItem(${i})" class="text-red-400 ml-1">✕</button>
          </div>`).join('')}
      </div>
      <div class="bg-white rounded-xl shadow p-4 mb-4">
        <div class="flex justify-between font-bold text-lg">
          <span>Total</span><span class="text-green-700">₹${cartTotal()}</span>
        </div>
      </div>
      <button onclick="navigate('checkout')" class="w-full bg-green-700 text-white py-3 rounded-xl font-bold text-lg hover:bg-green-800">
        Proceed to Checkout
      </button>`}
  </div>`;
}

function renderCheckout() {
  return `
  ${renderNav()}
  <div class="max-w-xl mx-auto px-4 py-6">
    <button onclick="navigate('cart')" class="text-green-700 mb-4">← Back to Cart</button>
    <h2 class="text-xl font-bold mb-4 text-gray-800">Checkout</h2>
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <h3 class="font-bold mb-3 text-gray-700">Order Summary</h3>
      ${state.cart.map(i => `
        <div class="flex justify-between text-sm py-1 border-b">
          <span>${i.name} (${i.size} · ${i.boxLabel}) x${i.qty}</span>
          <span>₹${i.pricePerBox * i.qty}</span>
        </div>`).join('')}
      <div class="flex justify-between font-bold mt-2 text-green-700">
        <span>Total</span><span>₹${cartTotal()}</span>
      </div>
    </div>
    <div class="bg-white rounded-xl shadow p-4 space-y-3">
      <h3 class="font-bold text-gray-700">Your Details</h3>
      <input id="co_name" type="text" placeholder="Full Name *" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-green-500" />
      <input id="co_phone" type="tel" placeholder="Phone Number *" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-green-500"
        onblur="autofillCustomer(this.value)" />
      <input id="co_gst" type="text" placeholder="GST Number (optional)" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-green-500" />
      <textarea id="co_address" placeholder="Shipping Address *" rows="2" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-green-500"></textarea>
      <input id="co_transport" type="text" placeholder="Transport Name (optional)" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-green-500" />
      <h3 class="font-bold text-gray-700 mt-2">Payment Method</h3>
      <div class="space-y-2">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="payment" value="cash" checked class="accent-green-700" /> Cash
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="payment" value="credit" class="accent-green-700" /> Credit / Pay Later
        </label>
      </div>
      <button onclick="this.disabled=true; this.textContent='Placing Order...'; placeOrder();"
        class="w-full bg-green-700 text-white py-3 rounded-xl font-bold text-lg hover:bg-green-800 mt-2">
        Place Order 🌿
      </button>
    </div>
  </div>`;
}

function renderConfirmation() {
  const o = state.lastOrder || {};
  return `
  ${renderNav()}
  <div class="max-w-xl mx-auto px-4 py-10 text-center">
    <div class="text-6xl mb-4">🎉</div>
    <h2 class="text-2xl font-bold text-green-700 mb-2">Order Placed!</h2>
    <p class="text-gray-500 mb-6">Thank you for your order. We'll process it shortly.</p>
    <div class="bg-white rounded-2xl shadow p-5 mb-6 text-left space-y-3">
      <div class="flex justify-between text-sm">
        <span class="text-gray-400">Order ID</span>
        <span class="font-bold text-gray-800">#${o.id || ''}</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-400">Phone</span>
        <span class="font-bold text-gray-800">${o.phone || ''}</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-400">Track using</span>
        <span class="font-bold text-gray-800">${o.phone || ''}</span>
      </div>

async function loadProducts() {
  state.loading = true;
  const { data: products } = await db.from('products').select('*').eq('is_available', true).order('name');
  const { data: variants } = await db.from('product_variants').select('*');
  const { data: packagings } = await db.from('product_packagings').select('*');
  state.products = (products || []).map(p => ({
    ...p,
    variants: (variants || []).filter(v => v.product_id === p.id).map(v => ({
      ...v,
      packagings: (packagings || []).filter(pk => pk.variant_id === v.id)
    }))
  }));
  state.loading = false;
  render();
  hideSplash();
}

function renderOrdersTab(activeStatus) {
  const content = document.getElementById('admin_content');
  if (!content) return;
  const statuses = ['pending','confirmed','dispatched','cancelled'];
  const statusColors = { pending:'bg-yellow-500', confirmed:'bg-blue-500', dispatched:'bg-green-600', cancelled:'bg-red-500' };
  const isGrouped = activeStatus === 'dispatched' || activeStatus === 'cancelled';
  const searchVal = (document.getElementById('order_search')?.value || '').toLowerCase();
  let orders = window._allOrders || [];
  const items = window._allItems || [];
  if (searchVal) {
    orders = orders.filter(o => {
      const nameMatch = (o.customers?.name || '').toLowerCase().includes(searchVal);
      const phoneMatch = (o.customers?.phone || '').toLowerCase().includes(searchVal);
      const productMatch = items.filter(i => i.order_id === o.id).some(i => (i.products?.name || '').toLowerCase().includes(searchVal));
      return nameMatch || phoneMatch || productMatch;
    });
  }
  const activeOrders = orders.filter(o => o.order_status === activeStatus);

  const orderCard = (o) => {
    const orderItems = items.filter(i => i.order_id === o.id);
    return `
    <div class="bg-white rounded-xl shadow p-4">
      <div class="flex justify-between items-start mb-2">
        <div>
          <div class="font-bold">${o.customers?.name || 'Unknown'}</div>
          <div class="text-sm text-gray-500">${o.customers?.phone || ''}</div>
          <div class="text-xs text-gray-400">${new Date(o.created_at).toLocaleString()}</div>
        </div>
        <div class="text-right">
          <div class="font-bold text-green-700">₹${o.total_amount}</div>
          <div class="text-xs text-blue-600">${o.payment_method}</div>
          <select onchange="updateOrderStatus('${o.id}',this.value,'${activeStatus}')" class="text-xs border rounded px-1 py-0.5 mt-1">
            ${statuses.map(s => `<option value="${s}" ${o.order_status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}
          </select>
          <button onclick="generateInvoice('${o.id}')" class="block mt-1 text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded w-full">🧾 Invoice</button>
          <button onclick="shareWhatsApp('${o.customers?.phone||''}','${o.customers?.name||'Customer'}',${o.total_amount})" class="block mt-1 text-xs bg-[#25D366] text-white px-2 py-0.5 rounded w-full">📲 WhatsApp</button>
          <button onclick="deleteOrder('${o.id}')" class="block mt-1 text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded w-full">🗑 Delete</button>
          <button onclick="showAddItemsToOrder('${o.id}')" class="block mt-1 text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded w-full">➕ Items</button>
          <button onclick="navigator.clipboard.writeText('${o.id.substring(0,8).toUpperCase()}'); alert('Order ID copied! ✅')" class="block mt-1 text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded w-full">📋 Copy ID</button>
        </div>
      </div>
      <div class="text-sm text-gray-600 border-t pt-2">
        ${orderItems.map(i => (i.product_name||i.products?.name||'') + ' (' + (i.variant_name||i.product_variants?.bag_size||'') + ') x' + i.quantity).join(', ')}
      </div>
      ${o.shipping_address ? `<div class="text-xs text-gray-400 mt-1">📍 ${o.shipping_address}</div>` : ''}
      ${o.transport_name ? `<div class="text-xs text-gray-400">🚚 ${o.transport_name}</div>` : ''}
      ${o.gst_number ? `<div class="text-xs text-gray-400">GST: ${o.gst_number}</div>` : ''}
    </div>`;
  };

  let ordersHTML = '';
  if (isGrouped) {
    const customerMap = {};
    activeOrders.forEach(o => {
      if (!customerMap[o.customer_id]) customerMap[o.customer_id] = { name: o.customers?.name||'Unknown', phone: o.customers?.phone||'', orders: [] };
      customerMap[o.customer_id].orders.push(o);
    });
    if (Object.keys(customerMap).length === 0) {
      ordersHTML = '<div class="text-gray-400 text-center py-6">No orders here</div>';
    } else {
      ordersHTML = Object.entries(customerMap).map(([custId, cust]) => `
        <div class="bg-white rounded-xl shadow p-4">
          <div class="flex justify-between items-center cursor-pointer" onclick="toggleCustomerOrders('${custId}')">
            <div>
              <div class="font-bold">${cust.name}</div>
              <div class="text-sm text-gray-500">${cust.phone}</div>
              <div class="text-xs text-gray-400">${cust.orders.length} order(s) · ₹${cust.orders.reduce((s,o)=>s+o.total_amount,0).toLocaleString('en-IN')}</div>
            </div>
            <div class="text-gray-400 text-xl">▾</div>
          </div>
          <div id="cust_orders_${custId}" class="hidden mt-3 space-y-3 border-t pt-3">
            ${cust.orders.map(o => {
              const orderItems = items.filter(i => i.order_id === o.id);
              return `
              <div class="bg-gray-50 rounded-lg p-3">
                <div class="flex justify-between items-start">
                  <div class="flex-1">
                    <div class="text-xs text-gray-400">${new Date(o.created_at).toLocaleString()}</div>
                    <div class="text-sm font-semibold text-green-700 mt-1">₹${o.total_amount} · ${o.payment_method}</div>
                    <div class="text-xs text-gray-600 mt-1">${orderItems.map(i=>(i.product_name||i.products?.name||'')+'('+(i.variant_name||i.product_variants?.bag_size||'')+') x'+i.quantity).join(', ')}</div>
                    ${o.shipping_address?`<div class="text-xs text-gray-400 mt-1">📍 ${o.shipping_address}</div>`:''}
                    ${o.transport_name?`<div class="text-xs text-gray-400">🚚 ${o.transport_name}</div>`:''}
                  </div>
                  <div class="flex flex-col gap-1 ml-2">
                    <select onchange="updateOrderStatus('${o.id}',this.value,'${activeStatus}')" class="text-xs border rounded px-1 py-0.5">
                      ${statuses.map(s=>`<option value="${s}" ${o.order_status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}
                    </select>
                    <button onclick="generateInvoice('${o.id}')" class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">🧾 Invoice</button>
                  </div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`).join('');
    }
  } else {
    ordersHTML = activeOrders.length === 0
      ? '<div class="text-gray-400 text-center py-6">No orders here</div>'
      : activeOrders.map(orderCard).join('');
  }

  const todaySalesTotal = (window._allOrders || []).filter(o => new Date(o.created_at).toDateString() === new Date().toDateString()).reduce((s, o) => s + (o.total_amount || 0), 0);
  const totalOrdersAmt = (window._allOrders || []).reduce((s, o) => s + (o.total_amount || 0), 0);
  content.innerHTML = `
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xl font-bold">Orders</h2>
      <button onclick="showCreateManualOrder()" class="bg-green-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold">+ New Order</button>
    </div>
    <div class="grid grid-cols-3 gap-2 mb-3">
      <div class="bg-green-50 rounded-xl p-2 text-center border border-green-100">
        <div class="text-xs text-gray-400">Today</div>
        <div class="font-bold text-green-700 text-sm">₹${todaySalesTotal.toLocaleString('en-IN')}</div>
      </div>
      <div class="bg-yellow-50 rounded-xl p-2 text-center border border-yellow-100">
        <div class="text-xs text-gray-400">Pending</div>
        <div class="font-bold text-yellow-600 text-sm">${(window._allOrders||[]).filter(o=>o.order_status==='pending').length}</div>
      </div>
      <div class="bg-blue-50 rounded-xl p-2 text-center border border-blue-100">
        <div class="text-xs text-gray-400">All Time</div>
        <div class="font-bold text-blue-600 text-sm">₹${totalOrdersAmt.toLocaleString('en-IN')}</div>
      </div>
    </div>
    <div id="manual_order_form"></div>
    <div class="flex gap-2 mb-3">
      <input id="order_search" type="text" placeholder="Search by name, phone or product..."
        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-green-500"
        oninput="renderOrdersTab('${activeStatus}')" />
    </div>
    <div class="grid grid-cols-2 gap-2 mb-4 sm:flex sm:flex-wrap">
      ${statuses.map(s => `
        <button onclick="renderOrdersTab('${s}')"
          class="px-3 py-2 rounded-xl text-sm font-medium border transition text-center
          ${activeStatus===s ? statusColors[s]+' text-white border-transparent' : 'bg-white text-gray-600 border-gray-300'}">
          ${s.charAt(0).toUpperCase()+s.slice(1)}
          <span class="ml-1 text-xs">(${(window._allOrders||[]).filter(o=>o.order_status===s).length})</span>
        </button>`).join('')}
    </div>
    <div class="space-y-3">${ordersHTML}</div>`;
}

function toggleCustomerOrders(custId) {
  const el = document.getElementById('cust_orders_' + custId);
  if (el) el.classList.toggle('hidden');
}

async function updateOrderStatus(orderId, status, currentTab) {
  await db.from('orders').update({ order_status: status }).eq('id', orderId);
  const order = (window._allOrders||[]).find(o => o.id === orderId);
  if (order) order.order_status = status;
  renderOrdersTab(currentTab);
}

async function generateInvoice(orderId) {
  window.open('invoice.html?id=' + orderId, '_blank');
  const order = (window._allOrders || []).find(o => o.id === orderId);
  if (order && order.customers?.phone) {
    setTimeout(() => {
      if (confirm('Send invoice notification via WhatsApp to ' + (order.customers?.name || 'customer') + '?')) {
        const fmt = n => '₹' + (n || 0).toLocaleString('en-IN');
        const msg = `Dear ${order.customers?.name || 'Customer'},\n\nYour order from *P.V.R Agrochemicals* has been processed.\n\n🧾 Order ID: #${orderId.substring(0,8).toUpperCase()}\n💰 Amount: *${fmt(order.total_amount)}*\n💳 Payment: ${order.payment_method}\n\nThank you for your business! 🌿\n📞 9573711019`;
        const clean = (order.customers.phone || '').replace(/\D/g, '');

function numberToWords(num) {
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(num===0)return'Zero';if(num<20)return ones[num];if(num<100)return tens[Math.floor(num/10)]+(num%10?' '+ones[num%10]:'');
  if(num<1000)return ones[Math.floor(num/100)]+' Hundred'+(num%100?' '+numberToWords(num%100):'');
  if(num<100000)return numberToWords(Math.floor(num/1000))+' Thousand'+(num%1000?' '+numberToWords(num%1000):'');
  if(num<10000000)return numberToWords(Math.floor(num/100000))+' Lakh'+(num%100000?' '+numberToWords(num%100000):'');
  return numberToWords(Math.floor(num/10000000))+' Crore'+(num%10000000?' '+numberToWords(num%10000000):'');
}

async function refreshCreditDetail(customerId) {
  const panel = document.getElementById('credit_detail_' + customerId);
  if (!panel) return;
  panel.innerHTML = '<div class="text-gray-400 text-sm text-center py-2">Loading...</div>';
  const { data: ledger } = await db.from('credit_ledger').select('*').eq('customer_id', customerId).order('created_at', { ascending: true });
  const orderIds = (ledger||[]).filter(e=>e.order_id).map(e=>e.order_id);
  let orderItemsMap = {};
  if (orderIds.length > 0) {
    const { data: allItems } = await db.from('order_items').select('*').in('order_id', orderIds);
    (allItems||[]).forEach(item => {
      if (!orderItemsMap[item.order_id]) orderItemsMap[item.order_id] = [];
      orderItemsMap[item.order_id].push((item.product_name||item.products?.name) + ' ' + (item.variant_name||item.product_variants?.bag_size) + ' x' + item.quantity);
    });
  }
  let runningBalance = 0;
  const rows = (ledger||[]).map(entry => {
    if (entry.type==='debit') runningBalance += entry.amount;
    else runningBalance -= entry.amount;
    const date = new Date(entry.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    const isDebit = entry.type === 'debit';
    const ref = entry.order_id ? '#'+entry.order_id.substring(0,8).toUpperCase() : 'Manual';
    const description = entry.order_id ? (orderItemsMap[entry.order_id]||[]).join(', ')||'Sale' : (entry.note||'Manual entry');
    return { date, isDebit, ref, description, amount: entry.amount, runningBalance, entryId: entry.id, safeNote: (entry.note||'').replace(/'/g,'') };
  });
  const totalDebit = rows.filter(r=>r.isDebit).reduce((s,r)=>s+r.amount,0);
  const totalCredit = rows.filter(r=>!r.isDebit).reduce((s,r)=>s+r.amount,0);
  const closingBalance = rows.length > 0 ? rows[rows.length-1].runningBalance : 0;
  panel.innerHTML = '<div class="border-t pt-4"><div class="font-bold text-gray-700 mb-3">📄 Party Statement (' + rows.length + ' entries)</div><div class="overflow-x-auto rounded-xl border border-gray-200"><table class="w-full text-xs border-collapse"><thead><tr class="bg-green-700 text-white"><th class="px-2 py-2 text-left">Date</th><th class="px-2 py-2 text-left">Description</th><th class="px-2 py-2 text-left">Ref</th><th class="px-2 py-2 text-right text-red-200">Debit</th><th class="px-2 py-2 text-right text-green-200">Credit</th><th class="px-2 py-2 text-right">Balance</th><th class="px-2 py-2 text-center">Edit</th></tr></thead><tbody>' +
    (rows.length===0 ? '<tr><td colspan="7" class="text-center py-6 text-gray-400">No entries yet</td></tr>' :
    rows.map(function(row,i){ return '<tr class="'+(i%2===0?'bg-white':'bg-gray-50')+' border-b border-gray-100"><td class="px-2 py-2 text-gray-500 whitespace-nowrap">'+row.date+'</td><td class="px-2 py-2 text-gray-700" style="max-width:160px;word-break:break-word;">'+row.description+'</td><td class="px-2 py-2 text-blue-500 font-mono">'+row.ref+'</td><td class="px-2 py-2 text-right font-semibold '+(row.isDebit?'text-red-600':'text-gray-300')+'">'+(row.isDebit?row.amount.toLocaleString('en-IN'):'—')+'</td><td class="px-2 py-2 text-right font-semibold '+(!row.isDebit?'text-green-600':'text-gray-300')+'">'+(!row.isDebit?row.amount.toLocaleString('en-IN'):'—')+'</td><td class="px-2 py-2 text-right font-bold whitespace-nowrap '+(row.runningBalance>0?'text-red-500':'text-green-600')+'">'+Math.abs(row.runningBalance).toLocaleString('en-IN')+' <span class="text-gray-400 font-normal">'+(row.runningBalance>0?'Dr':'Cr')+'</span></td><td class="px-2 py-2 text-center whitespace-nowrap"><button onclick="editLedgerEntry(\''+row.entryId+'\',\''+customerId+'\','+row.amount+',\''+row.safeNote+'\')" class="text-blue-400 mr-1">✏️</button><button onclick="deleteLedgerEntry(\''+row.entryId+'\',\''+customerId+'\')" class="text-red-400">🗑</button></td></tr>'; }).join('')) +
    '</tbody><tfoot><tr class="bg-gray-800 text-white font-bold text-xs"><td colspan="3" class="px-2 py-2">Closing Balance</td><td class="px-2 py-2 text-right text-red-300">'+totalDebit.toLocaleString('en-IN')+'</td><td class="px-2 py-2 text-right text-green-300">'+totalCredit.toLocaleString('en-IN')+'</td><td class="px-2 py-2 text-right '+(closingBalance>0?'text-red-300':'text-green-300')+'">'+Math.abs(closingBalance).toLocaleString('en-IN')+' <span class="font-normal">'+(closingBalance>0?'Dr':'Cr')+'</span></td><td></td></tr></tfoot></table></div></div>';
}

async function recordPayment(customerId, customerName, balance) {
  const amount = prompt('Record payment for ' + customerName + '\nCurrent balance: ₹' + balance + '\n\nEnter amount paid:');
  if (!amount || isNaN(amount)) return;
  const note = prompt('Add a note (optional):') || 'Payment received';
  const via = prompt('Received via (type cash or bank):') || 'cash';
  const paidVia = via.toLowerCase().includes('bank') ? 'bank' : 'cash';
  await db.from('credit_ledger').insert({ customer_id: customerId, amount: parseFloat(amount), type: 'credit', note });
  const { data: latest } = await db.from('cash_bank_ledger').select('running_balance').eq('account_type', paidVia).order('created_at', { ascending: false }).limit(1);
  const currentBal = latest && latest.length > 0 ? latest[0].running_balance : 0;
  await db.from('cash_bank_ledger').insert({ account_type: paidVia, entry_type: 'in', amount: parseFloat(amount), running_balance: currentBal + parseFloat(amount), reference_type: 'customer_payment', note: 'Payment from ' + customerName });
  alert('Payment of ₹' + amount + ' recorded! ✅');
  if (confirm('Print payment receipt?')) {
    window.open('payment-receipt.html?customer_id=' + customerId + '&amount=' + amount + '&note=' + encodeURIComponent(note) + '&via=' + paidVia, '_blank');
  }
  await refreshCreditSummaryCard(customerId);
  await refreshCreditDetail(customerId);
}

async function editLedgerEntry(entryId, customerId, currentAmount, currentNote) {

async function placeOrder() {
  const name = document.getElementById('co_name').value.trim();
  const phone = document.getElementById('co_phone').value.trim();
  const gst = document.getElementById('co_gst').value.trim();
  const address = document.getElementById('co_address').value.trim();
  const transport = document.getElementById('co_transport').value.trim();
  const payment = document.querySelector('input[name="payment"]:checked')?.value || 'cash';
  if (!name || !phone || !address) { alert('Please fill in Name, Phone and Shipping Address!'); return; }
  try {
    const { data: customer } = await db.from('customers')
      .upsert({ name, phone, address, gst_number: gst, transport_name: transport }, { onConflict: 'phone' })
      .select().single();
    const { data: order } = await db.from('orders').insert({
      customer_id: customer.id, total_amount: cartTotal(),
      payment_method: payment, payment_status: 'pending', order_status: 'pending',
      gst_number: gst, shipping_address: address, transport_name: transport,
    }).select().single();
    await db.from('order_items').insert(state.cart.map(i => ({
      order_id: order.id, product_id: i.productId, variant_id: i.variantId,
      quantity: i.qty, unit_price: i.pricePerBox, total_price: i.pricePerBox * i.qty,
      product_name: i.name, variant_name: i.size,
    })));
    for (const item of state.cart) {
      const { data: pkg } = await db.from('product_packagings').select('stock_quantity').eq('id', item.pkgId).single();
      if (pkg) await db.from('product_packagings').update({ stock_quantity: Math.max(0, pkg.stock_quantity - item.qty) }).eq('id', item.pkgId);
    }
    await db.from('credit_ledger').insert({
      customer_id: customer.id, order_id: order.id,
      amount: cartTotal(), type: 'debit',
      note: payment === 'cash' ? 'Cash order' : 'Credit order',
    });
    state.cart = []; saveCart();
    state.lastOrder = { id: order.id.substring(0,8).toUpperCase(), phone, name, total: cartTotal() };
    state.page = 'confirmation';
    render();
  } catch (err) { alert('Error placing order. Please try again.'); console.error(err); }
}

async function saveNewProduct() {
  const name = document.getElementById('np_name').value.trim();

  const desc = document.getElementById('np_desc').value.trim();
  const hsn = document.getElementById('np_hsn').value.trim();

  let image_url = null;
  const imageFile = document.getElementById('np_image').files[0];
  if (imageFile) {
    const fileExt = imageFile.name.split('.').pop();
    const fileName = Date.now() + '.' + fileExt;
    const { data: uploadData } = await db.storage.from('product-images').upload(fileName, imageFile);
    if (uploadData) {
      const { data: urlData } = db.storage.from('product-images').getPublicUrl(fileName);
      image_url = urlData.publicUrl;
    }
  }
  const { data: product, error: productError } = await db.from('products').insert({
    name, category, description: desc,
    company_name: document.getElementById('np_company').value.trim(),
    chemical_name: document.getElementById('np_chemical').value.trim(),
    hsn_code: hsn, image_url, is_available: true
  }).select().single();
  if (productError) { alert('Error saving product: ' + productError.message); return; }
  const variantBlocks = document.querySelectorAll('.variant-block');
  for (const block of variantBlocks) {
    const size = block.querySelector('.variant_size').value.trim();
    if (!size) continue;
    const { data: variant, error: variantError } = await db.from('product_variants').insert({
      product_id: product.id, bag_size: size, price: 0, stock_quantity: 0
    }).select().single();
    if (variantError) { console.error('Variant error:', variantError); continue; }
    const pkgRows = block.querySelectorAll('.pkg-row');
    for (const row of pkgRows) {
      const label = row.querySelector('.pkg_label')?.value.trim();
      const price = row.querySelector('.pkg_price')?.value;
      if (!label || !price) continue;
      const { error: pkgError } = await db.from('product_packagings').insert({
        variant_id: variant.id, box_label: label,
        units_per_box: parseInt(row.querySelector('.pkg_units')?.value) || 1,
        mrp_per_unit: parseFloat(row.querySelector('.pkg_mrp')?.value) || null,
        price_per_unit: parseFloat(row.querySelector('.pkg_price_unit')?.value) || null,
        price_per_box: parseFloat(price),
        cost_price: parseFloat(row.querySelector('.pkg_cost')?.value) || 0,
        stock_quantity: parseInt(row.querySelector('.pkg_stock')?.value) || 0,
      });
      if (pkgError) console.error('Packaging error:', pkgError);
    }
  }
  alert('Product added successfully! 🌿');
  showAdminTab('products');
}

async function saveEditProduct(productId) {
  const updateData = {
    name: document.getElementById('ep_name').value.trim(),
    category: document.getElementById('ep_category').value,
    company_name: document.getElementById('ep_company').value.trim(),
    chemical_name: document.getElementById('ep_chemical').value.trim(),
    description: document.getElementById('ep_desc').value.trim(),
    hsn_code: document.getElementById('ep_hsn').value.trim(),
  };
  const imageFile = document.getElementById('ep_image').files[0];
  if (imageFile) {
    const fileExt = imageFile.name.split('.').pop();
    const fileName = Date.now() + '.' + fileExt;
    const { data: uploadData } = await db.storage.from('product-images').upload(fileName, imageFile);
    if (uploadData) {
      const { data: urlData } = db.storage.from('product-images').getPublicUrl(fileName);
      updateData.image_url = urlData.publicUrl;
    }
  }
  await db.from('products').update(updateData).eq('id', productId);
  const product = state.adminProducts?.find(p => p.id === productId);
  for (const v of (product?.product_variants || [])) {
    for (const pk of (v.packagings || [])) {
      const price = document.getElementById('pk_price_' + pk.id)?.value;
      if (price) await db.from('product_packagings').update({
        box_label: document.getElementById('pk_label_' + pk.id)?.value,
        units_per_box: parseInt(document.getElementById('pk_units_' + pk.id)?.value) || 1,
        mrp_per_unit: parseFloat(document.getElementById('pk_mrp_' + pk.id)?.value) || null,
        price_per_unit: parseFloat(document.getElementById('pk_price_unit_' + pk.id)?.value) || null,
        price_per_box: parseFloat(price),
        cost_price: parseFloat(document.getElementById('pk_cost_' + pk.id)?.value) || 0,
        stock_quantity: parseInt(document.getElementById('pk_stock_' + pk.id)?.value) || 0,
      }).eq('id', pk.id);
    }
    const newPkgRows = document.querySelectorAll('#new_pkgs_' + v.id + ' .new-pkg-row');
    for (const row of newPkgRows) {
      const label = row.querySelector('.pkg_label')?.value.trim();
      const price = row.querySelector('.pkg_price')?.value;
      if (!label || !price) continue;
      await db.from('product_packagings').insert({
        variant_id: v.id, box_label: label,
        units_per_box: parseInt(row.querySelector('.pkg_units')?.value) || 1,
        mrp_per_unit: parseFloat(row.querySelector('.pkg_mrp')?.value) || null,
        price_per_unit: parseFloat(row.querySelector('.pkg_price_unit')?.value) || null,
        price_per_box: parseFloat(price),
        cost_price: parseFloat(row.querySelector('.pkg_cost')?.value) || 0,
        stock_quantity: parseInt(row.querySelector('.pkg_stock')?.value) || 0,
      });
    }
  }
  alert('Product updated! 🌿');
  showAdminTab('products');
}

function renderProductGrid() {
  let filtered = state.products.filter(p => {
    const matchCat = state.category === 'all' || p.category === state.category;
    const matchSearch = p.name.toLowerCase().includes(state.search.toLowerCase()) ||
      (p.chemical_name && p.chemical_name.toLowerCase().includes(state.search.toLowerCase())) ||
      (p.company_name && p.company_name.toLowerCase().includes(state.search.toLowerCase()));
    return matchCat && matchSearch;
  });
  const sort = state.sort || 'name';
  filtered = filtered.sort((a, b) => {
    const aPk = a.variants?.[0]?.packagings?.[0];
    const bPk = b.variants?.[0]?.packagings?.[0];
    if (sort === 'price_asc') return (aPk?.price_per_box || 0) - (bPk?.price_per_box || 0);
    if (sort === 'price_desc') return (bPk?.price_per_box || 0) - (aPk?.price_per_box || 0);
    return a.name.localeCompare(b.name);
  });
  const grid = document.getElementById('product_grid');
  if (!grid) return;
  if (filtered.length === 0 && !state.loading) {
    grid.innerHTML = '<div class="col-span-2 text-center py-10 text-gray-400">No products found</div>';
    return;
  }
  grid.innerHTML = filtered.map(p => {
    const v = p.variants && p.variants[0];
    const pk = v && v.packagings && v.packagings[0];
    let availV = null, availPk = null;
    for (const variant of (p.variants || [])) {
      const found = (variant.packagings || []).find(pk => pk.stock_quantity > 0);
      if (found) { availV = variant; availPk = found; break; }
    }
    const canAdd = !!availPk;
    const img = p.image_url ? '<img src="' + p.image_url + '" class="w-full h-full object-cover" />' : renderPlaceholder(p.category);
    const price = pk ? '<div class="text-xs text-gray-400">MRP: \u20b9' + (pk.mrp_per_unit||'-') + '/unit</div><div class="text-green-700 font-bold text-sm">Billing: \u20b9' + (pk.price_per_unit||'-') + '/unit</div><div class="text-xs text-gray-500">\u20b9' + pk.price_per_box + '/' + pk.box_label + '</div>' : '<div class="text-xs text-gray-400">No variants</div>';
    const chem = p.chemical_name ? '<div class="text-xs text-blue-400 mb-1">' + p.chemical_name + '</div>' : '';
    const canAdd = (p.variants || []).some(v => (v.packagings || []).some(pk => pk.stock_quantity > 0));
    return '<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 hover:shadow-md transition">'
      + '<div class="w-full h-40 rounded-lg mb-2 overflow-hidden cursor-pointer" onclick="state.selectedProduct=\'' + p.id + '\'; state.page=\'product\'; render();">' + img + '</div>'
      + '<div class="font-semibold text-gray-800 text-sm cursor-pointer" onclick="state.selectedProduct=\'' + p.id + '\'; state.page=\'product\'; render();">' + p.name + '</div>'
      + '<div class="text-xs text-gray-500 mb-1">' + (p.company_name ? p.company_name + ' · ' : '') + p.category + '</div>'
      + chem + price
      + (canAdd ? '<button onclick="quickAddToCart(\'' + p.id + '\')" class="mt-2 w-full bg-green-700 text-white text-xs py-1.5 rounded-lg font-bold hover:bg-green-800">+ Add to Cart</button>' : '<div class="mt-2 w-full text-center text-xs text-red-400 font-medium py-1.5 bg-red-50 rounded-lg">Out of Stock</div>')
      + '</div>';
  }).join('');
}

function quickAddToCart(productId) {
  const product = state.products.find(p => p.id === productId);
  let v = null, pk = null;
  for (const variant of (product?.variants || [])) {
    const availPkg = (variant.packagings || []).find(p => p.stock_quantity > 0);
    if (availPkg) { v = variant; pk = availPkg; break; }
  }
  if (!product || !v || !pk) return;
  const existing = state.cart.find(i => i.pkgId === pk.id);
  if (existing) { existing.qty += 1; }
  else {
    state.cart.push({
      productId, variantId: v.id, pkgId: pk.id,
      name: product.name, size: v.bag_size,
      boxLabel: pk.box_label, unitsPerBox: pk.units_per_box,
      pricePerUnit: pk.price_per_unit, mrpPerUnit: pk.mrp_per_unit,
      pricePerBox: pk.price_per_box, qty: 1,
    });
  }
  saveCart();
  renderCartBar();
  const btn = event.target;
  btn.textContent = '✅ Added!';
  btn.classList.replace('bg-green-700', 'bg-green-500');
  setTimeout(() => { btn.textContent = '+ Add to Cart'; btn.classList.replace('bg-green-500', 'bg-green-700'); }, 1000);
}

function moAddItem() {
  const pid = document.getElementById('mo_product_select').value;
  const vid = document.getElementById('mo_variant_select').value;
  const pkgId = document.getElementById('mo_pkg_select').value;
  const qty = parseInt(document.getElementById('mo_qty').value) || 1;
  const product = (window._moProducts || []).find(p => p.id === pid);
  const variant = (product?.product_variants || []).find(v => v.id === vid);
  const pkg = (variant?.product_packagings || []).find(pk => pk.id === pkgId);
  if (!product || !variant || !pkg) return;
  window._moItems = window._moItems || [];
  window._moItems.push({ productId: pid, variantId: vid, pkgId, name: product.name, size: variant.bag_size, boxLabel: pkg.box_label, pricePerBox: pkg.price_per_box, pricePerUnit: pkg.price_per_unit, qty });
  moRenderItems();
  document.getElementById('mo_variant_row').classList.add('hidden');
  document.getElementById('mo_product_select').value = '';
}

function moRenderItems() {
  const items = window._moItems || [];
  const list = document.getElementById('mo_items_list');
  if (!list) return;
  let total = 0;
  list.innerHTML = items.map((item, i) => {
    total += item.pricePerBox * item.qty;
    return `<div class="flex justify-between items-center bg-gray-50 rounded-lg px-3 py-2 mb-1 text-sm">
      <div><span class="font-medium">${item.name}</span> <span class="text-gray-500">${item.size} · ${item.boxLabel}</span> x${item.qty}</div>
      <div class="flex items-center gap-2"><span class="font-bold text-green-700">₹${item.pricePerBox * item.qty}</span>
      <button onclick="window._moItems.splice(${i},1); moRenderItems();" class="text-red-400 text-xs">✕</button></div>
    </div>`;
  }).join('');
  const totalEl = document.getElementById('mo_total');
  if (totalEl) totalEl.textContent = 'Total: ₹' + total;
}

async function saveManualOrder() {
  const name = document.getElementById('mo_name').value.trim();
  const phone = document.getElementById('mo_phone').value.trim();
  const address = document.getElementById('mo_address').value.trim();
  const gst = document.getElementById('mo_gst').value.trim();
  const transport = document.getElementById('mo_transport').value.trim();
  const payment = document.getElementById('mo_payment').value;
  const items = window._moItems || [];
  if (!name || !phone || !address) { alert('Name, Phone and Address are required!'); return; }
  if (items.length === 0) { alert('Add at least one item!'); return; }
  const total = items.reduce((s, i) => s + i.pricePerBox * i.qty, 0);
  try {
    const { data: customer } = await db.from('customers')
      .upsert({ name, phone, address, gst_number: gst, transport_name: transport }, { onConflict: 'phone' })
      .select().single();
    const { data: order } = await db.from('orders').insert({
      customer_id: customer.id, total_amount: total,
      payment_method: payment, payment_status: 'pending', order_status: 'pending',
      gst_number: gst, shipping_address: address, transport_name: transport,
    }).select().single();
    await db.from('order_items').insert(items.map(i => ({
      order_id: order.id, product_id: i.productId, variant_id: i.variantId,
      quantity: i.qty, unit_price: i.pricePerBox, total_price: i.pricePerBox * i.qty,
      product_name: i.name, variant_name: i.size,
    })));
    for (const item of items) {
      const { data: pkg } = await db.from('product_packagings').select('stock_quantity').eq('id', item.pkgId).single();
      if (pkg) await db.from('product_packagings').update({ stock_quantity: Math.max(0, pkg.stock_quantity - item.qty) }).eq('id', item.pkgId);
    }
    await db.from('credit_ledger').insert({
      customer_id: customer.id, order_id: order.id,
      amount: total, type: 'debit',
      note: payment === 'cash' ? 'Cash order (manual)' : 'Credit order (manual)',
    });
    alert('Manual order placed! ✅\nOrder ID: ' + order.id.substring(0,8).toUpperCase());
    showAdminTab('orders');

function aiConfirmItem(orderId) {

async function aiSaveItems(orderId, customerId) {
  const items = window['_aiItems_' + orderId] || [];
  if (items.length === 0) { alert('No items added!'); return; }
  const addedTotal = items.reduce((s, i) => s + i.pricePerBox * i.qty, 0);
  try {
    await db.from('order_items').insert(items.map(i => ({
      order_id: orderId, product_id: i.productId, variant_id: i.variantId,
      quantity: i.qty, unit_price: i.pricePerBox, total_price: i.pricePerBox * i.qty,
      product_name: i.name, variant_name: i.size,
    })));
    const { data: currentOrder } = await db.from('orders').select('total_amount').eq('id', orderId).single();
    const newTotal = (currentOrder?.total_amount || 0) + addedTotal;
    await db.from('orders').update({ total_amount: newTotal }).eq('id', orderId);
    for (const item of items) {
      const { data: pkg } = await db.from('product_packagings').select('stock_quantity').eq('id', item.pkgId).single();
      if (pkg) await db.from('product_packagings').update({ stock_quantity: Math.max(0, pkg.stock_quantity - item.qty) }).eq('id', item.pkgId);
    }
    await db.from('credit_ledger').insert({
      customer_id: customerId, order_id: orderId,
      amount: addedTotal, type: 'debit', note: 'Items added to existing order',
    });
    alert('Items added! ✅ Order total updated to ₹' + newTotal);
    showAdminTab('orders');
  } catch (err) { alert('Error: ' + err.message); console.error(err); }
}

function filterPurchases() {
  const search = document.getElementById('purchase_search')?.value.toLowerCase() || '';
  const from = document.getElementById('purchase_from')?.value || '';
  const to = document.getElementById('purchase_to')?.value || '';
  document.querySelectorAll('.purchase-card').forEach(card => {
    const supplier = card.dataset.supplier || '';
    const products = card.dataset.products || '';
    const billno = card.dataset.billno || '';
    const date = card.dataset.date || '';
    const matchSearch = supplier.includes(search) || products.includes(search) || billno.includes(search);
    const matchFrom = !from || date >= from;
    const matchTo = !to || date <= to;
    card.style.display = (matchSearch && matchFrom && matchTo) ? 'block' : 'none';
  });
}

function addPurchaseItem() {
  const pid = document.getElementById('ni_product_select').value;
  const vid = document.getElementById('ni_variant_select').value;
  const pkgId = document.getElementById('ni_pkg_select').value;
  const qty = parseFloat(document.getElementById('ni_qty').value) || 0;
  const price = parseFloat(document.getElementById('ni_price').value) || 0;
  if (!pid || !vid || !pkgId) { alert('Please select product, variant and packaging!'); return; }
  if (!qty || !price) { alert('Quantity and price are required!'); return; }
  const product = (window._npProducts || []).find(p => p.id === pid);
  const variant = (product?.product_variants || []).find(v => v.id === vid);
  const pkg = (variant?.product_packagings || []).find(pk => pk.id === pkgId);
  const gst = parseFloat(document.getElementById('ni_gst').value) || 0;
  const total = qty * price * (1 + gst / 100);
  window._npItems = window._npItems || [];
  window._npItems.push({
    product_id: pid,
    variant_id: vid,
    pkg_id: pkgId,
    product_name: product.name,
    variant_name: variant.bag_size,
    pkg_label: pkg.box_label,
    hsn_code: document.getElementById('ni_hsn').value.trim(),
    batch_number: document.getElementById('ni_batch').value.trim(),
    exp_date: document.getElementById('ni_exp').value.trim(),
    mfg_date: document.getElementById('ni_mfg').value.trim(),
    size: variant.bag_size,
    quantity: qty,
    unit: 'Box',
    unit_price: price,
    gst_percent: gst,
    total_price: total,
  });
  renderPurchaseItems();
  document.getElementById('ni_product_select').value = '';
  document.getElementById('ni_variant_select').innerHTML = '<option value="">-- Select Size/Variant --</option>';
  document.getElementById('ni_pkg_select').innerHTML = '<option value="">-- Select Packaging --</option>';
  ['ni_hsn','ni_batch','ni_exp','ni_mfg','ni_qty','ni_price'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
  document.getElementById('ni_gst').value = '18';
}

async function saveNewPurchase() {
  const supplierId = document.getElementById('np_supplier').value;
  const supplierEl = document.getElementById('np_supplier');
  const supplierName = supplierId ? supplierEl.options[supplierEl.selectedIndex].dataset.name : '';
  const items = window._npItems || [];
  if (!supplierId) { alert('Please select a supplier!'); return; }
  if (items.length === 0) { alert('Add at least one item!'); return; }
  const subTotal = items.reduce((s, i) => s + i.total_price, 0);
  const transportCharges = parseFloat(document.getElementById('np_transport_charges').value) || 0;
  const totalAmount = subTotal + transportCharges;
  const paidAmount = parseFloat(document.getElementById('np_paid').value) || 0;
  const balance = totalAmount - paidAmount;
  const { data: purchase, error } = await db.from('purchases').insert({
    supplier_id: supplierId,
    supplier_name: supplierName,
    bill_number: document.getElementById('np_bill_no').value.trim(),
    bill_date: document.getElementById('np_bill_date').value,
    place_of_supply: document.getElementById('np_place').value.trim(),
    transport_name: document.getElementById('np_transport').value.trim(),
    delivery_location: document.getElementById('np_delivery').value.trim(),
    payment_method: document.getElementById('np_payment').value,
    sub_total: subTotal,
    transport_charges: transportCharges,
    total_amount: totalAmount,
    paid_amount: paidAmount,
    balance: balance,
  }).select().single();
  if (error) { alert('Error: ' + error.message); return; }
  await db.from('purchase_items').insert(items.map(i => ({
    purchase_id: purchase.id,
    product_id: i.product_id,
    variant_id: i.variant_id,
    product_name: i.product_name,
    hsn_code: i.hsn_code,
    batch_number: i.batch_number,
    exp_date: i.exp_date,
    mfg_date: i.mfg_date,
    size: i.size,
    quantity: i.quantity,
    unit: i.unit,
    unit_price: i.unit_price,
    gst_percent: i.gst_percent,
    total_price: i.total_price,
  })));
  for (const item of items) {
    if (item.pkg_id) {
      const { data: pkg } = await db.from('product_packagings').select('stock_quantity').eq('id', item.pkg_id).single();
      if (pkg) await db.from('product_packagings').update({ stock_quantity: (pkg.stock_quantity || 0) + item.quantity }).eq('id', item.pkg_id);
    }
  }
  await db.from('supplier_ledger').insert({ supplier_id: supplierId, purchase_id: purchase.id, amount: totalAmount, type: 'debit', note: 'Purchase bill: ' + (document.getElementById('np_bill_no').value.trim() || purchase.id.substring(0,8)) });
  if (paidAmount > 0) {
    await db.from('supplier_ledger').insert({ supplier_id: supplierId, purchase_id: purchase.id, amount: paidAmount, type: 'credit', note: 'Payment at time of purchase' });
  }
  alert('Purchase saved! ✅');
  showAdminTab('purchases');
}

async function deletePurchase(purchaseId) {
  if (!confirm('Delete this purchase? This will also reverse the stock and supplier ledger entries.')) return;
  const { data: items } = await db.from('purchase_items').select('*').eq('purchase_id', purchaseId);
  for (const item of (items || [])) {
    if (item.size) {
      const { data: variants } = await db.from('product_variants').select('id, stock_quantity').ilike('bag_size', '%' + item.size + '%');
      if (variants && variants.length > 0) {
        const v = variants[0];
        await db.from('product_variants').update({ stock_quantity: Math.max(0, (v.stock_quantity || 0) - item.quantity) }).eq('id', v.id);
      }
    }
  }
  await db.from('purchase_items').delete().eq('purchase_id', purchaseId);
  await db.from('supplier_ledger').delete().eq('purchase_id', purchaseId);
  await db.from('purchases').delete().eq('id', purchaseId);
  alert('Purchase deleted! Stock reversed. ✅');
  showAdminTab('purchases');
}

async function saveAddItemToPurchase(purchaseId) {
  const product = document.getElementById('nadd_product_' + purchaseId)?.value.trim();
  const qty = parseFloat(document.getElementById('nadd_qty_' + purchaseId)?.value) || 0;
  const price = parseFloat(document.getElementById('nadd_price_' + purchaseId)?.value) || 0;
  if (!product || !qty || !price) { alert('Product name, quantity and price are required!'); return; }
  const gst = parseFloat(document.getElementById('nadd_gst_' + purchaseId)?.value) || 0;
  const total = qty * price * (1 + gst / 100);
  await db.from('purchase_items').insert({
    purchase_id: purchaseId,
    product_name: product,
    hsn_code: document.getElementById('nadd_hsn_' + purchaseId)?.value.trim(),
    batch_number: document.getElementById('nadd_batch_' + purchaseId)?.value.trim(),
    exp_date: document.getElementById('nadd_exp_' + purchaseId)?.value.trim(),
    mfg_date: document.getElementById('nadd_mfg_' + purchaseId)?.value.trim(),
    size: document.getElementById('nadd_size_' + purchaseId)?.value.trim(),
    quantity: qty,
    unit: document.getElementById('nadd_unit_' + purchaseId)?.value,
    unit_price: price,
    gst_percent: gst,
    total_price: total,
  });
  const { data: currentPurchase } = await db.from('purchases').select('sub_total, transport_charges, paid_amount').eq('id', purchaseId).single();
  const newSubTotal = (currentPurchase?.sub_total || 0) + total;
  const newTotal = newSubTotal + (currentPurchase?.transport_charges || 0);
  const newBalance = newTotal - (currentPurchase?.paid_amount || 0);
  await db.from('purchases').update({ sub_total: newSubTotal, total_amount: newTotal, balance: newBalance }).eq('id', purchaseId);
  alert('Item added! ✅');
  showAdminTab('purchases');
}

async function saveEditPurchase(purchaseId) {
  const items = (window._allPurchaseItems || []).filter(i => i.purchase_id === purchaseId);
  let subTotal = 0;
  for (const item of items) {
    const oldQty = item.quantity || 0;
    const qty = parseFloat(document.getElementById('epi_qty_' + item.id)?.value) || 0;
    const price = parseFloat(document.getElementById('epi_price_' + item.id)?.value) || 0;
    const gst = parseFloat(document.getElementById('epi_gst_' + item.id)?.value) || 0;
    const total = qty * price * (1 + gst / 100);
    subTotal += total;
    const newName = document.getElementById('epi_name_' + item.id)?.value;
    const newSize = document.getElementById('epi_size_' + item.id)?.value;
    await db.from('purchase_items').update({
      product_name: newName,
      hsn_code: document.getElementById('epi_hsn_' + item.id)?.value,
      batch_number: document.getElementById('epi_batch_' + item.id)?.value,
      exp_date: document.getElementById('epi_exp_' + item.id)?.value,
      mfg_date: document.getElementById('epi_mfg_' + item.id)?.value,
      size: newSize,
      quantity: qty, unit_price: price, gst_percent: gst, total_price: total,
    }).eq('id', item.id);
    const qtyDiff = qty - oldQty;
    if (qtyDiff !== 0 && newSize) {
      const { data: variants } = await db.from('product_variants').select('id, stock_quantity').ilike('bag_size', '%' + newSize + '%');
      if (variants && variants.length > 0) {
        const v = variants[0];
        await db.from('product_variants').update({ stock_quantity: Math.max(0, (v.stock_quantity || 0) + qtyDiff) }).eq('id', v.id);
      }
    }
  }
  const transportCharges = parseFloat(document.getElementById('ep_transport_charges').value) || 0;
  const paidAmount = parseFloat(document.getElementById('ep_paid').value) || 0;
  const totalAmount = subTotal + transportCharges;
  const balance = totalAmount - paidAmount;
  await db.from('purchases').update({
    bill_number: document.getElementById('ep_bill_no').value,
    bill_date: document.getElementById('ep_bill_date').value,
    place_of_supply: document.getElementById('ep_place').value,
    transport_name: document.getElementById('ep_transport').value,
    delivery_location: document.getElementById('ep_delivery').value,
    transport_charges: transportCharges,
    sub_total: subTotal,
    total_amount: totalAmount,
    paid_amount: paidAmount,
    balance: balance,
  }).eq('id', purchaseId);
  const { data: currentLedger } = await db.from('supplier_ledger').select('*').eq('purchase_id', purchaseId).eq('type', 'debit').single();
  if (currentLedger) {
    await db.from('supplier_ledger').update({ amount: totalAmount, note: 'Purchase bill updated: ' + (document.getElementById('ep_bill_no').value || purchaseId.substring(0,8)) }).eq('id', currentLedger.id);
  }
  alert('Purchase updated! Stock and supplier ledger adjusted! ✅');
  showAdminTab('purchases');
}

      ${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,amt])=>`<tr class="border-b"><td class="px-3 py-2">${c}</td><td class="px-3 py-2 text-right font-bold text-red-500">₹${amt.toLocaleString('en-IN')}</td></tr>`).join('')}

async function deleteCashBankEntry(entryId) {
  if (!confirm('Delete this entry?')) return;
  await db.from('cash_bank_ledger').delete().eq('id', entryId);
  const { data: allEntries } = await db.from('cash_bank_ledger').select('*').order('created_at', { ascending: true });
  const cashEntries = (allEntries || []).filter(l => l.account_type === 'cash');
  const bankEntries = (allEntries || []).filter(l => l.account_type === 'bank');
  let cashBal = 0;
  for (const entry of cashEntries) {
    cashBal = entry.entry_type === 'in' ? cashBal + entry.amount : cashBal - entry.amount;
    await db.from('cash_bank_ledger').update({ running_balance: cashBal }).eq('id', entry.id);
  }
  let bankBal = 0;
  for (const entry of bankEntries) {
    bankBal = entry.entry_type === 'in' ? bankBal + entry.amount : bankBal - entry.amount;
    await db.from('cash_bank_ledger').update({ running_balance: bankBal }).eq('id', entry.id);
  }
  alert('Entry deleted and balances recalculated! ✅');
  showAdminTab('cashbank');
}

async function showAgingReport(forceRefresh) {
  window._agingForceRefresh = forceRefresh || false;
  const panel = document.getElementById('aging_report_panel');
  if (!panel) return;
  if (panel.innerHTML !== '' && !window._agingForceRefresh) { panel.innerHTML = ''; return; }
  window._agingForceRefresh = false;
  panel.innerHTML = '<div class="text-gray-400 text-sm text-center py-2">Loading...</div>';
  const { data: credits } = await db.from('credit_summary').select('*');
  const { data: orders } = await db.from('orders').select('*').eq('payment_method', 'credit');
  const { data: agingOverrides } = await db.from('customer_aging_override').select('*');
  const today = new Date();
  const aging = (credits || []).filter(c => c.balance > 0).map(c => {
    const customerOrders = (orders || []).filter(o => o.customer_id === c.customer_id);
    const oldest = customerOrders.reduce((min, o) => {
      const d = new Date(o.created_at);
      return d < min ? d : min;
    }, today);
    const overrideEntry = (agingOverrides || []).find(o => o.customer_id === c.customer_id);
    const days = overrideEntry ? overrideEntry.days_override : Math.floor((today - oldest) / (1000 * 60 * 60 * 24));
    let bracket = '0-30 days';
    let color = 'text-green-600';
    if (days > 90) { bracket = '90+ days'; color = 'text-red-700 font-bold'; }
    else if (days > 60) { bracket = '61-90 days'; color = 'text-red-500'; }
    else if (days > 30) { bracket = '31-60 days'; color = 'text-orange-500'; }
    return { name: c.name, phone: c.phone, balance: c.balance, customerId: c.customer_id, days, bracket, color };
  }).sort((a, b) => b.days - a.days);
  if (aging.length === 0) {
    panel.innerHTML = '<div class="bg-white rounded-xl shadow p-4 text-green-600 font-bold text-center">No outstanding balances! ✅</div>';
    return;
  }
  panel.innerHTML = `
    <div class="bg-white rounded-xl shadow p-4">
      <div class="font-bold text-lg mb-3">📊 Credit Aging Report</div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
        <div class="bg-green-50 rounded-lg p-2 text-center">

async function toggleSupplierDetail(supplierId) {
  const panel = document.getElementById('supplier_detail_' + supplierId);
  if (!panel) return;
  if (!panel.classList.contains('hidden')) { panel.classList.add('hidden'); panel.innerHTML = ''; return; }
  panel.classList.remove('hidden');
  await refreshSupplierDetail(supplierId);
}

async function refreshSupplierDetail(supplierId) {
  const panel = document.getElementById('supplier_detail_' + supplierId);
  if (!panel) return;
  panel.innerHTML = '<div class="text-gray-400 text-sm text-center py-2">Loading...</div>';
  const { data: ledger } = await db.from('supplier_ledger').select('*').eq('supplier_id', supplierId).order('created_at', { ascending: true });
  let runningBalance = 0;
  const rows = (ledger || []).map(entry => {
    if (entry.type === 'debit') runningBalance += entry.amount;
    else runningBalance -= entry.amount;
    const date = new Date(entry.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    const isDebit = entry.type === 'debit';
    return { date, isDebit, amount: entry.amount, runningBalance, entryId: entry.id, note: (entry.note || '').replace(/'/g, '') };
  });
  const totalDebit = rows.filter(r => r.isDebit).reduce((s, r) => s + r.amount, 0);
  const totalCredit = rows.filter(r => !r.isDebit).reduce((s, r) => s + r.amount, 0);
  const closing = rows.length > 0 ? rows[rows.length - 1].runningBalance : 0;
  panel.innerHTML = `<div class="border-t pt-4">
    <div class="font-bold text-gray-700 mb-3">📄 Supplier Statement (${rows.length} entries)</div>
    <div class="overflow-x-auto rounded-xl border border-gray-200">
      <table class="w-full text-xs border-collapse">
        <thead><tr class="bg-green-700 text-white">
          <th class="px-2 py-2 text-left">Date</th>
          <th class="px-2 py-2 text-left">Note</th>
          <th class="px-2 py-2 text-right text-red-200">Debit</th>
          <th class="px-2 py-2 text-right text-green-200">Credit</th>
          <th class="px-2 py-2 text-right">Balance</th>
          <th class="px-2 py-2 text-center">Edit</th>
        </tr></thead>
        <tbody>
          ${rows.length === 0 ? '<tr><td colspan="6" class="text-center py-6 text-gray-400">No entries yet</td></tr>' :
            rows.map((row, i) => `<tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} border-b border-gray-100">
              <td class="px-2 py-2 text-gray-500 whitespace-nowrap">${row.date}</td>
              <td class="px-2 py-2 text-gray-700">${row.note}</td>
              <td class="px-2 py-2 text-right font-semibold ${row.isDebit ? 'text-red-600' : 'text-gray-300'}">${row.isDebit ? row.amount.toLocaleString('en-IN') : '—'}</td>
              <td class="px-2 py-2 text-right font-semibold ${!row.isDebit ? 'text-green-600' : 'text-gray-300'}">${!row.isDebit ? row.amount.toLocaleString('en-IN') : '—'}</td>
              <td class="px-2 py-2 text-right font-bold whitespace-nowrap ${row.runningBalance > 0 ? 'text-red-500' : 'text-green-600'}">${Math.abs(row.runningBalance).toLocaleString('en-IN')} <span class="text-gray-400 font-normal">${row.runningBalance > 0 ? 'Dr' : 'Cr'}</span></td>
              <td class="px-2 py-2 text-center whitespace-nowrap">
                <button onclick="editSupplierEntry('${row.entryId}','${supplierId}',${row.amount},'${row.note}')" class="text-blue-400 mr-1">✏️</button>
                <button onclick="deleteSupplierEntry('${row.entryId}','${supplierId}')" class="text-red-400">🗑</button>
              </td>
            </tr>`).join('')}
        </tbody>
        <tfoot><tr class="bg-gray-800 text-white font-bold text-xs">
          <td colspan="2" class="px-2 py-2">Closing Balance</td>
          <td class="px-2 py-2 text-right text-red-300">${totalDebit.toLocaleString('en-IN')}</td>
          <td class="px-2 py-2 text-right text-green-300">${totalCredit.toLocaleString('en-IN')}</td>
          <td class="px-2 py-2 text-right ${closing > 0 ? 'text-red-300' : 'text-green-300'}">${Math.abs(closing).toLocaleString('en-IN')} <span class="font-normal">${closing > 0 ? 'Dr' : 'Cr'}</span></td>
          <td></td>
        </tr></tfoot>
      </table>
    </div>
  </div>`;
}

async function recordSupplierPayment(supplierId, supplierName, balance) {
  const amount = prompt('Record payment to ' + supplierName + '\nCurrent balance you owe: ₹' + balance + '\n\nEnter amount paid:');
  if (!amount || isNaN(amount)) return;
  const note = prompt('Add a note (optional):') || 'Payment made';
  const via = prompt('Paid via (type cash or bank):') || 'cash';
  const paidVia = via.toLowerCase().includes('bank') ? 'bank' : 'cash';
  await db.from('supplier_ledger').insert({ supplier_id: supplierId, amount: parseFloat(amount), type: 'credit', note });
  const { data: latest } = await db.from('cash_bank_ledger').select('running_balance').eq('account_type', paidVia).order('created_at', { ascending: false }).limit(1);
  const currentBal = latest && latest.length > 0 ? latest[0].running_balance : 0;
  await db.from('cash_bank_ledger').insert({ account_type: paidVia, entry_type: 'out', amount: parseFloat(amount), running_balance: currentBal - parseFloat(amount), reference_type: 'supplier_payment', note: 'Payment to ' + supplierName });
  alert('Payment of ₹' + amount + ' recorded and deducted from ' + paidVia + '! ✅');
  showAdminTab('suppliers');
}

async function editSupplierEntry(entryId, supplierId, currentAmount, currentNote) {
  const amount = prompt('Edit amount:\nCurrent: ₹' + currentAmount, currentAmount);
  if (!amount || isNaN(amount)) return;
  const note = prompt('Edit note:\nCurrent: ' + currentNote, currentNote);
  if (note === null) return;
  await db.from('supplier_ledger').update({ amount: parseFloat(amount), note }).eq('id', entryId);
  alert('Entry updated! ✅');
  await showAdminTab('suppliers');
}

async function deleteSupplierEntry(entryId, supplierId) {
  if (!confirm('Delete this entry?')) return;
  await db.from('supplier_ledger').delete().eq('id', entryId);
  await refreshSupplierDetail(supplierId);
}

function getISTDateString(date) {
  const ist = new Date(date.getTime() + (5.5 * 60 * 60 * 1000));
  return ist.toISOString().split('T')[0];
}

function setMonthRange(which) {
  const now = new Date();
  let from, to;
  if (which === 'this') {
    from = new Date(now.getFullYear(), now.getMonth(), 1);
    to = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  } else {
    from = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    to = new Date(now.getFullYear(), now.getMonth(), 0);
  }
  const fromEl = document.getElementById('rep_from');
  const toEl = document.getElementById('rep_to');
  if (fromEl) fromEl.value = getISTDateString(from);
  if (toEl) toEl.value = getISTDateString(to);
}

          <div class="bg-red-50 rounded-lg p-3 text-center">
            <div class="text-xs text-gray-500">Total Purchases</div>
            <div class="font-bold text-red-600">${fmt(totalPurchases)}</div>
            <div class="text-xs text-gray-400">${(purchases||[]).length} bills</div>

          <div class="bg-orange-50 rounded-lg p-3 text-center">
            <div class="text-xs text-gray-500">Total Expenses</div>
            <div class="font-bold text-orange-600">${fmt(totalExpenses)}</div>
            <div class="text-xs text-gray-400">${(expenses||[]).length} entries</div>
          </div>
        </div>
