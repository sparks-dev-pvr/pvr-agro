<div id="app"></div>

<script>
// ============================================
// SUPABASE SETUP
// ============================================
const SUPABASE_URL = 'https://ipdjajuhfqmuuzjejlwn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwZGphanVoZnFtdXV6amVqbHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNDY2ODcsImV4cCI6MjA5MzYyMjY4N30.Y1w43s7vx2V_XkgYvSUB0xTIsnGGFWyCU09z_r_otEg';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================
// STATE
// ============================================
let state = {
  page: 'home',
  products: [],
  cart: JSON.parse(localStorage.getItem('pvr_cart') || '[]'),
  orders: [],
  search: '',
  category: 'all',
  adminLoggedIn: false,
  loading: false,
  selectedProduct: null,
};

function saveCart() {
  localStorage.setItem('pvr_cart', JSON.stringify(state.cart));
}

function cartTotal() {
  return state.cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
}

// ============================================
// RENDER
// ============================================
function render() {
  const app = document.getElementById('app');
  if (state.page === 'admin' && !state.adminLoggedIn) {
    app.innerHTML = renderAdminLogin();
  } else if (state.page === 'admin') {
    app.innerHTML = renderAdmin();
    loadAdminData();
  } else if (state.page === 'cart') {
    app.innerHTML = renderCart();
  } else if (state.page === 'checkout') {
    app.innerHTML = renderCheckout();
  } else if (state.page === 'track') {
    app.innerHTML = renderTrack();
  } else if (state.page === 'product') {
    app.innerHTML = renderProduct();
  } else {
    app.innerHTML = renderHome();
    if(state.products.length === 0) loadProducts();
  }
  attachEvents();
}

// ============================================
// NAVBAR
// ============================================
function renderNav() {
  const cartCount = state.cart.reduce((s, i) => s + i.qty, 0);
  return `
  <nav class="bg-green-700 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-50 shadow">
    <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
      <span class="text-2xl">🌿</span>
      <span class="font-bold text-xl">PVR Agro</span>
    </div>
    <div class="flex items-center gap-4">
      <span class="cursor-pointer text-sm hover:underline" onclick="navigate('track')">Track Order</span>
      <span class="cursor-pointer relative" onclick="navigate('cart')">
        🛒
        ${cartCount > 0 ? `<span class="absolute -top-2 -right-2 bg-yellow-400 text-black text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">${cartCount}</span>` : ''}
      </span>
    </div>
  </nav>`;
}

// ============================================
// HOME
// ============================================
function renderHome() {
  const categories = ['all', 'Bio-Pesticides', 'Pesticides', 'Fungicides', 'Seeds', 'Fertilizers', 'Herbicides', 'Weedicides'];
  const filtered = state.products.filter(p => {
    const matchCat = state.category === 'all' || p.category === state.category;
    const matchSearch = p.name.toLowerCase().includes(state.search.toLowerCase()) ||
      (p.chemical_name && p.chemical_name.toLowerCase().includes(state.search.toLowerCase())) ||
      (p.company_name && p.company_name.toLowerCase().includes(state.search.toLowerCase()));
    return matchCat && matchSearch;
  });

  return `
  ${renderNav()}
  <div class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex gap-2 mb-4">
      <input id="searchInput" type="text" placeholder="Search products..."
        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-green-500" />
      <button onclick="state.search=document.getElementById('searchInput').value; render();"
        class="bg-green-700 text-white px-4 py-2 rounded-lg font-medium">Search</button>
      <button onclick="state.search=''; state.products=[]; render();"
        class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-medium">Clear</button>
    </div>
    <div class="flex gap-2 overflow-x-auto pb-2 mb-6">
      ${categories.map(c => `
        <button onclick="state.category='${c}'; render();"
          class="whitespace-nowrap px-3 py-1 rounded-full text-sm font-medium border transition
          ${state.category === c ? 'bg-green-700 text-white border-green-700' : 'bg-white text-gray-700 border-gray-300'}">
          ${c === 'all' ? 'All Products' : c}
        </button>`).join('')}
    </div>
    ${state.loading ? '<div class="text-center py-10 text-gray-500">Loading products...</div>' : ''}
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="product_grid">
      ${filtered.map(p => `
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 cursor-pointer hover:shadow-md transition"
          onclick="state.selectedProduct='${p.id}'; state.page='product'; render();">
          <div class="w-full h-28 bg-green-50 rounded-lg flex items-center justify-center mb-2 text-4xl">
            ${p.image_url ? `<img src="${p.image_url}" class="w-full h-full object-cover rounded-lg" />` : getCategoryEmoji(p.category)}
          </div>
          <div class="font-semibold text-gray-800 text-sm">${p.name}</div>
          <div class="text-xs text-gray-500 mb-1">${p.company_name ? p.company_name + ' · ' : ''}${p.category}</div>
          ${p.chemical_name ? `<div class="text-xs text-blue-400">${p.chemical_name}</div>` : ''}
          ${p.variants && p.variants.length > 0 ? `
            <div class="text-xs text-gray-400">MRP: ₹${p.variants[0].mrp || '-'}</div>
            <div class="text-green-700 font-bold text-sm">₹${p.variants[0].price}</div>
          ` : '<div class="text-xs text-gray-400">No variants</div>'}
        </div>`).join('')}
    </div>
    ${filtered.length === 0 && !state.loading ? '<div class="text-center py-10 text-gray-400">No products found</div>' : ''}
  </div>`;
}

function getCategoryEmoji(cat) {
  const map = {
    'Bio-Pesticides': '🌿',
    'Pesticides': '🧪',
    'Seeds': '🌱',
    'Fertilizers': '💊',
    'Herbicides': '🌾',
    'Weedicides': '☘️',
  };
  return map[cat] || '📦';
}

// ============================================
// PRODUCT PAGE
// ============================================
function renderProduct() {
  const product = state.products.find(p => p.id === state.selectedProduct);
  if (!product) return `${renderNav()}<div class="p-8 text-center">Product not found</div>`;
  const variants = product.variants || [];
  return `
  ${renderNav()}
  <div class="max-w-xl mx-auto px-4 py-6">
    <button onclick="navigate('home')" class="text-green-700 mb-4 flex items-center gap-1">← Back</button>
    <div class="bg-white rounded-xl shadow p-4">
      <div class="w-full h-48 bg-green-50 rounded-xl flex items-center justify-center text-6xl mb-4">
        ${product.image_url ? `<img src="${product.image_url}" class="w-full h-full object-cover rounded-xl" />` : getCategoryEmoji(product.category)}
      </div>
      <h1 class="text-xl font-bold text-gray-800">${product.name}</h1>
      <p class="text-sm text-gray-500 mb-1">${product.category}</p>
      <p class="text-sm text-gray-600 mb-4">${product.description || ''}</p>
      <div class="space-y-3">
        ${variants.filter(v => v.price > 0).map(v => `
          <div class="border border-gray-200 rounded-lg p-3 flex items-center justify-between">
            <div>
              <div class="font-semibold text-gray-800">${v.bag_size}</div>
              <div class="text-xs text-gray-400">MRP: ₹${v.mrp || '-'}</div>
              <div class="text-green-700 font-bold">Price: ₹${v.price}</div>
              <div class="text-xs text-gray-400">Stock: ${v.stock_quantity}</div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="this.nextElementSibling.stepDown()" class="w-8 h-8 bg-gray-100 rounded-full font-bold text-lg">-</button>
              <input type="number" id="qty_${v.id}" value="1" min="1" class="w-12 text-center border rounded-lg py-1 text-sm" />
              <button onclick="this.previousElementSibling.stepUp()" class="w-8 h-8 bg-gray-100 rounded-full font-bold text-lg">+</button>
            </div>
            <button onclick="addToCartQty('${product.id}','${v.id}','${product.name}','${v.bag_size}',${v.price})"
              class="bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-800">
              Add to Cart
            </button>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

// ============================================

// ============================================
// LOAD DATA
// ============================================
async function loadProducts() {
  state.loading = true;
  const { data: products } = await db.from('products').select('*').eq('is_available', true).order('name');
  const { data: variants } = await db.from('product_variants').select('*').gt('price', 0);
  state.products = (products || []).map(p => ({
    ...p,
    variants: (variants || []).filter(v => v.product_id === p.id)
  }));
  state.loading = false;
  render();
}

async function loadAdminData() {
  showAdminTab('orders');
}

async function showAdminTab(tab) {
  const content = document.getElementById('admin_content');
  if (!content) return;
  content.innerHTML = '<div class="text-center py-10 text-gray-400">Loading...</div>';

  if (tab === 'orders') {
    const { data: orders } = await db.from('orders').select('*, customers(name, phone)').order('created_at', { ascending: false });
    const { data: items } = await db.from('order_items').select('*, products(name), product_variants(bag_size)');
    window._allOrders = orders || [];
    window._allItems = items || [];
    renderOrdersTab('pending');
    return;
      function renderOrdersTab(activeStatus) {
  const content = document.getElementById('admin_content');
  if (!content) return;
  const orders = window._allOrders || [];
  const items = window._allItems || [];
  const statuses = ['pending','confirmed','delivering','delivered','cancelled'];
  const activeOrders = orders.filter(o => o.order_status === activeStatus);
  const isGrouped = activeStatus === 'delivered' || activeStatus === 'cancelled';

  const statusColors = {
    pending: 'bg-yellow-500', confirmed: 'bg-blue-500',
    delivering: 'bg-orange-500', delivered: 'bg-green-600', cancelled: 'bg-red-500'
  };

  let ordersHTML = '';
  if (isGrouped) {
    const customerMap = {};
    activeOrders.forEach(o => {
      const key = o.customer_id;
      if (!customerMap[key]) customerMap[key] = { name: o.customers?.name || 'Unknown', phone: o.customers?.phone || '', orders: [] };
      customerMap[key].orders.push(o);
    });
    if (Object.keys(customerMap).length === 0) {
      ordersHTML = '<div class="text-gray-400 text-center py-6">No orders here</div>';
    } else {
      ordersHTML = Object.entries(customerMap).map(([custId, cust]) => `
        <div class="bg-white rounded-xl shadow p-4">
          <div class="flex justify-between items-center cursor-pointer" onclick="toggleCustomerOrders('${custId}')">
            <div>
              <div class="font-bold">${cust.name}</div>
              <div class="text-sm text-gray-500">${cust.phone}</div>
              <div class="text-xs text-gray-400">${cust.orders.length} order(s) · ₹${cust.orders.reduce((s,o) => s+o.total_amount,0)}</div>
            </div>
            <div class="text-gray-400 text-xl">▾</div>
          </div>
          <div id="cust_orders_${custId}" class="hidden mt-3 space-y-3 border-t pt-3">
            ${cust.orders.map(o => {
              const orderItems = items.filter(i => i.order_id === o.id);
              return `
              <div class="bg-gray-50 rounded-lg p-3">
                <div class="flex justify-between items-start">
                  <div class="flex-1">
                    <div class="text-xs text-gray-400">${new Date(o.created_at).toLocaleString()}</div>
                    <div class="text-sm font-semibold text-green-700 mt-1">₹${o.total_amount} · ${o.payment_method}</div>
                    <div class="text-xs text-gray-600 mt-1">${orderItems.map(i => i.products?.name + ' (' + i.product_variants?.bag_size + ') x' + i.quantity).join(', ')}</div>
                    ${o.shipping_address ? '<div class="text-xs text-gray-400 mt-1">📍 ' + o.shipping_address + '</div>' : ''}
                    ${o.transport_name ? '<div class="text-xs text-gray-400">🚚 ' + o.transport_name + '</div>' : ''}
                  </div>
                  <select onchange="updateOrderStatus('${o.id}', this.value)" class="text-xs border rounded px-1 py-0.5 ml-2">
                    ${statuses.map(s => '<option value="' + s + '" ' + (o.order_status === s ? 'selected' : '') + '>' + s + '</option>').join('')}
                  </select>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`).join('');
    }
  } else {
    if (activeOrders.length === 0) {
      ordersHTML = '<div class="text-gray-400 text-center py-6">No orders here</div>';
    } else {
      ordersHTML = activeOrders.map(o => {
        const orderItems = items.filter(i => i.order_id === o.id);
        return `
        <div class="bg-white rounded-xl shadow p-4">
          <div class="flex justify-between items-start mb-2">
            <div>
              <div class="font-bold">${o.customers?.name || 'Unknown'}</div>
              <div class="text-sm text-gray-500">${o.customers?.phone || ''}</div>
              <div class="text-xs text-gray-400">${new Date(o.created_at).toLocaleString()}</div>
            </div>
            <div class="text-right">
              <div class="font-bold text-green-700">₹${o.total_amount}</div>
              <div class="text-xs text-blue-600">${o.payment_method}</div>
              <select onchange="updateOrderStatus('${o.id}', this.value)" class="text-xs border rounded px-1 py-0.5 mt-1">
                ${statuses.map(s => '<option value="' + s + '" ' + (o.order_status === s ? 'selected' : '') + '>' + s + '</option>').join('')}
              </select>
            </div>
          </div>
          <div class="text-sm text-gray-600 border-t pt-2">
            ${orderItems.map(i => i.products?.name + ' (' + i.product_variants?.bag_size + ') x' + i.quantity).join(', ')}
          </div>
          ${o.shipping_address ? '<div class="text-xs text-gray-400 mt-1">📍 ' + o.shipping_address + '</div>' : ''}
          ${o.transport_name ? '<div class="text-xs text-gray-400">🚚 ' + o.transport_name + '</div>' : ''}
          ${o.gst_number ? '<div class="text-xs text-gray-400">GST: ' + o.gst_number + '</div>' : ''}
        </div>`;
      }).join('');
    }
  }

  content.innerHTML = `
    <h2 class="text-xl font-bold mb-4">Orders</h2>
    <div class="flex gap-2 overflow-x-auto pb-2 mb-4">
      ${statuses.map(s => `
        <button onclick="renderOrdersTab('${s}')"
          class="whitespace-nowrap px-3 py-1 rounded-full text-sm font-medium border transition
          ${activeStatus === s ? statusColors[s] + ' text-white border-transparent' : 'bg-white text-gray-600 border-gray-300'}">
          ${s.charAt(0).toUpperCase() + s.slice(1)}
          <span class="ml-1 text-xs">(${orders.filter(o => o.order_status === s).length})</span>
        </button>`).join('')}
    </div>
    <div class="space-y-3">${ordersHTML}</div>`;
}

async function toggleCreditDetail(customerId) {
  const panel = document.getElementById('credit_detail_' + customerId);
  if (!panel) return;
  if (!panel.classList.contains('hidden')) {
    panel.classList.add('hidden');
    panel.innerHTML = '';
    return;
  }
  panel.classList.remove('hidden');
  panel.innerHTML = '<div class="text-gray-400 text-sm text-center py-2">Loading statement...</div>';

  const { data: ledger } = await db.from('credit_ledger')
    .select('*')
    .eq('customer_id', customerId)
    .order('created_at', { ascending: true });

  const orderIds = (ledger || []).filter(e => e.order_id).map(e => e.order_id);
  let orderItemsMap = {};
  if (orderIds.length > 0) {
    const { data: allItems } = await db.from('order_items')
      .select('*, products(name), product_variants(bag_size)')
      .in('order_id', orderIds);
    (allItems || []).forEach(item => {
      if (!orderItemsMap[item.order_id]) orderItemsMap[item.order_id] = [];
      orderItemsMap[item.order_id].push(`${item.products?.name} ${item.product_variants?.bag_size} x${item.quantity}`);
    });
  }

  let runningBalance = 0;
  const rows = (ledger || []).map(entry => {
    if (entry.type === 'debit') {
      runningBalance += entry.amount;
    } else {
      runningBalance -= entry.amount;
    }
    const date = new Date(entry.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    const isDebit = entry.type === 'debit';
    const ref = entry.order_id ? '#' + entry.order_id.substring(0, 8).toUpperCase() : 'Manual';
    const description = entry.order_id
      ? (orderItemsMap[entry.order_id] || []).join(', ') || 'Sale'
      : (entry.note || 'Manual entry');
    const safeNote = (entry.note || '').replace(/'/g, '');
    return { date, isDebit, ref, description, amount: entry.amount, runningBalance, entryId: entry.id, safeNote };
  });

  const totalDebit = rows.filter(r => r.isDebit).reduce((s, r) => s + r.amount, 0);
  const totalCredit = rows.filter(r => !r.isDebit).reduce((s, r) => s + r.amount, 0);
  const closingBalance = rows.length > 0 ? rows[rows.length - 1].runningBalance : 0;

  panel.innerHTML = `
    <div class="border-t pt-4">
      <div class="flex justify-between items-center mb-3">
        <div class="font-bold text-gray-700">📄 Party Statement</div>
        <div class="text-xs text-gray-400">${rows.length} entries</div>
      </div>
      <div class="overflow-x-auto rounded-xl border border-gray-200">
        <table class="w-full text-xs border-collapse">
          <thead>
            <tr class="bg-green-700 text-white">
              <th class="px-2 py-2 text-left">Date</th>
              <th class="px-2 py-2 text-left">Description</th>
              <th class="px-2 py-2 text-left">Ref</th>
              <th class="px-2 py-2 text-right text-red-200">Debit (₹)</th>
              <th class="px-2 py-2 text-right text-green-200">Credit (₹)</th>
              <th class="px-2 py-2 text-right">Balance (₹)</th>
              <th class="px-2 py-2 text-center">Edit</th>
            </tr>
          </thead>
          <tbody>
            ${rows.length === 0 ? `
              <tr><td colspan="7" class="text-center py-6 text-gray-400">No entries yet</td></tr>
            ` : rows.map((row, i) => `
              <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} border-b border-gray-100 hover:bg-yellow-50 transition">
                <td class="px-2 py-2 text-gray-500 whitespace-nowrap">${row.date}</td>
                <td class="px-2 py-2 text-gray-700" style="max-width:160px; word-break:break-word;">${row.description}</td>
                <td class="px-2 py-2 text-blue-500 whitespace-nowrap font-mono">${row.ref}</td>
                <td class="px-2 py-2 text-right font-semibold ${row.isDebit ? 'text-red-600' : 'text-gray-300'}">
                  ${row.isDebit ? row.amount.toLocaleString('en-IN') : '—'}
                </td>
                <td class="px-2 py-2 text-right font-semibold ${!row.isDebit ? 'text-green-600' : 'text-gray-300'}">
                  ${!row.isDebit ? row.amount.toLocaleString('en-IN') : '—'}
                </td>
                <td class="px-2 py-2 text-right font-bold whitespace-nowrap ${row.runningBalance > 0 ? 'text-red-500' : 'text-green-600'}">
                  ${Math.abs(row.runningBalance).toLocaleString('en-IN')}
                  <span class="text-gray-400 font-normal">${row.runningBalance > 0 ? 'Dr' : 'Cr'}</span>
                </td>
                <td class="px-2 py-2 text-center whitespace-nowrap">
                  <button onclick="editLedgerEntry('${row.entryId}', '${customerId}', ${row.amount}, '${row.safeNote}')"
                    class="text-blue-400 hover:text-blue-600 mr-1">✏️</button>
                  <button onclick="deleteLedgerEntry('${row.entryId}', '${customerId}')"
                    class="text-red-400 hover:text-red-600">🗑</button>
                </td>
              </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr class="bg-gray-800 text-white font-bold text-xs">
              <td colspan="3" class="px-2 py-2">Closing Balance</td>
              <td class="px-2 py-2 text-right text-red-300">${totalDebit.toLocaleString('en-IN')}</td>
              <td class="px-2 py-2 text-right text-green-300">${totalCredit.toLocaleString('en-IN')}</td>
              <td class="px-2 py-2 text-right ${closingBalance > 0 ? 'text-red-300' : 'text-green-300'}">
                ${Math.abs(closingBalance).toLocaleString('en-IN')}
                <span class="font-normal">${closingBalance > 0 ? ' Dr' : ' Cr'}</span>
              </td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>`;
}

async function recordPayment(customerId, customerName, balance) {
  const amount = prompt(`Record payment for ${customerName}\nCurrent balance: ₹${balance}\n\nEnter amount paid:`);
  if (!amount || isNaN(amount)) return;
  const note = prompt('Add a note (optional, e.g. "Cash payment", "UPI ref #123"):') || 'Payment received';
  await db.from('credit_ledger').insert({
    customer_id: customerId,
    amount: parseFloat(amount),
    type: 'credit',
    note: note,
  });
  alert(`Payment of ₹${amount} recorded! ✅`);
  showAdminTab('credit');
}

async function addManualEntry(customerId, customerName, type) {
  const label = type === 'debit' ? 'debit (amount customer owes)' : 'credit (amount customer paid)';
  const amount = prompt(`Add manual ${label} for ${customerName}\n\nEnter amount:`);
  if (!amount || isNaN(amount)) return;
  const note = prompt('Note for this entry (e.g. "Old dues from April", "Cash received"):') || (type === 'debit' ? 'Manual debit entry' : 'Manual credit entry');
  await db.from('credit_ledger').insert({
    customer_id: customerId,
    amount: parseFloat(amount),
    type: type,
    note: note,
  });
  alert(`Manual ${type} of ₹${amount} added! ✅`);
  showAdminTab('credit');
}

async function editLedgerEntry(entryId, customerId, currentAmount, currentNote) {
  const amount = prompt(`Edit amount:\nCurrent: ₹${currentAmount}`, currentAmount);
  if (!amount || isNaN(amount)) return;
  const note = prompt(`Edit note:\nCurrent: ${currentNote}`, currentNote);
  if (note === null) return;
  await db.from('credit_ledger').update({
    amount: parseFloat(amount),
    note: note,
  }).eq('id', entryId);
  alert('Entry updated! ✅');
  showAdminTab('credit');
}

async function deleteLedgerEntry(entryId, customerId) {
  if (!confirm('Delete this ledger entry? This cannot be undone.')) return;
  const { error } = await db.from('credit_ledger').delete().eq('id', entryId);
  if (error) {
    alert('Error deleting: ' + error.message);
    return;
  }
  alert('Entry deleted! ✅');
  await toggleCreditDetail(customerId);
  await toggleCreditDetail(customerId);
}

function addToCart(productId, variantId, name, size, price) {
  const existing = state.cart.find(i => i.variantId === variantId);
  if (existing) {
    existing.qty += 1;
  } else {
    state.cart.push({ productId, variantId, name, size, price, qty: 1 });
  }
  saveCart();
  alert(`${name} (${size}) added to cart! 🛒`);
  render();
}

function addToCartQty(productId, variantId, name, size, price) {
  const qty = parseInt(document.getElementById('qty_' + variantId)?.value) || 1;
  const variant = state.products.flatMap(p => p.variants || []).find(v => v.id === variantId);
  if (variant && variant.stock_quantity === 0) {
    alert(`Sorry! ${name} (${size}) is out of stock!`);
    return;
  }
  if (variant && variant.stock_quantity < qty) {
    alert(`Sorry! Only ${variant.stock_quantity} units available for ${name} (${size})`);
    return;
  }
  const existing = state.cart.find(i => i.variantId === variantId);
  if (existing) {
    existing.qty += qty;
  } else {
    state.cart.push({ productId, variantId, name, size, price, qty });
  }
  saveCart();
  alert(`${name} (${size}) x${qty} added to cart! 🛒`);
  render();
}

function updateQty(index, delta) {
  state.cart[index].qty += delta;
  if (state.cart[index].qty <= 0) state.cart.splice(index, 1);
  saveCart();
  render();
}

function removeItem(index) {
  state.cart.splice(index, 1);
  saveCart();
  render();
}

async function placeOrder() {
  const name = document.getElementById('co_name').value.trim();
  const phone = document.getElementById('co_phone').value.trim();
  const gst = document.getElementById('co_gst').value.trim();
  const address = document.getElementById('co_address').value.trim();
  const transport = document.getElementById('co_transport').value.trim();
  const payment = document.querySelector('input[name="payment"]:checked')?.value || 'cod';

  if (!name || !phone || !address) {
    alert('Please fill in Name, Phone and Shipping Address!');
    return;
  }

  try {
    const { data: customer } = await db.from('customers')
      .upsert({ name, phone, address, gst_number: gst, transport_name: transport }, { onConflict: 'phone' })
      .select().single();

    const { data: order } = await db.from('orders').insert({
      customer_id: customer.id,
      total_amount: cartTotal(),
      payment_method: payment,
      payment_status: 'pending',
      order_status: 'pending',
      gst_number: gst,
      shipping_address: address,
      transport_name: transport,
    }).select().single();

    const orderItems = state.cart.map(i => ({
      order_id: order.id,
      product_id: i.productId,
      variant_id: i.variantId,
      quantity: i.qty,
      unit_price: i.price,
      total_price: i.price * i.qty,
    }));
    await db.from('order_items').insert(orderItems);

    for (const item of state.cart) {
      const variant = state.products.flatMap(p => p.variants || []).find(v => v.id === item.variantId);
      if (variant) {
        const newStock = Math.max(0, variant.stock_quantity - item.qty);
        await db.from('product_variants').update({ stock_quantity: newStock }).eq('id', item.variantId);
      }
    }

    if (payment === 'credit') {
      await db.from('credit_ledger').insert({
        customer_id: customer.id,
        order_id: order.id,
        amount: cartTotal(),
        type: 'debit',
        note: 'Credit order placed',
      });
    }

    state.cart = [];
    saveCart();
    alert(`Order placed successfully! 🌿\nYour order ID: ${order.id.substring(0,8).toUpperCase()}\nTrack with phone: ${phone}`);
    state.products = [];
    navigate('home');
  } catch (err) {
    alert('Error placing order. Please try again.');
    console.error(err);
  }
}

async function saveEditProduct(productId) {
  const name = document.getElementById('ep_name').value.trim();
  const company = document.getElementById('ep_company').value.trim();
  const chemical = document.getElementById('ep_chemical').value.trim();
  const desc = document.getElementById('ep_desc').value.trim();
  await db.from('products').update({
    name, company_name: company, chemical_name: chemical, description: desc
  }).eq('id', productId);
  const product = state.adminProducts?.find(p => p.id === productId);
  if (product?.product_variants) {
    for (const v of product.product_variants) {
      const mrp = document.getElementById('ep_mrp_' + v.id)?.value;
      const price = document.getElementById('ep_price_' + v.id)?.value;
      const stock = document.getElementById('ep_stock_' + v.id)?.value;
      if (price) await db.from('product_variants').update({
        mrp: parseFloat(mrp),
        price: parseFloat(price),
        stock_quantity: parseInt(stock)
      }).eq('id', v.id);
    }
  }
  alert('Product updated! 🌿');
  showAdminTab('products');
}

  await db.from('product_variants').delete().eq('product_id', productId);

  alert('Product deleted!');
  showAdminTab('products');
}

async function updateOrderStatus(orderId, status) {
  await db.from('orders').update({ order_status: status }).eq('id', orderId);

  const activeTabs = document.querySelectorAll('[onclick^="renderOrdersTab"]');
  const activeBtn = Array.from(activeTabs).find(b => b.classList.contains('text-white'));
  const currentStatus = activeBtn ? activeBtn.getAttribute('onclick').match(/'(\w+)'/)?.[1] : 'pending';
  renderOrdersTab(currentStatus);
}

    <input placeholder="Price" type="number" class="variant_price border rounded px-2 py-1 text-sm w-20" />
    <input placeholder="Stock" type="number" class="variant_stock border rounded px-2 py-1 text-sm w-20" />`;
  container.appendChild(row);
}

async function saveNewProduct() {
  const name = document.getElementById('np_name').value.trim();
  const category = document.getElementById('np_category').value;
  const desc = document.getElementById('np_desc').value.trim();
  if (!name) { alert('Product name is required!'); return; }
  let image_url = null;
  const imageFile = document.getElementById('np_image').files[0];
  if (imageFile) {
    const fileExt = imageFile.name.split('.').pop();
    const fileName = `${Date.now()}.${fileExt}`;
    const { data: uploadData } = await db.storage.from('product-images').upload(fileName, imageFile);
    if (uploadData) {
      const { data: urlData } = db.storage.from('product-images').getPublicUrl(fileName);
      image_url = urlData.publicUrl;
    }
  }
  const company = document.getElementById('np_company').value.trim();
  const chemical = document.getElementById('np_chemical').value.trim();
  const { data: product } = await db.from('products').insert({
    name, category, description: desc, company_name: company, chemical_name: chemical, image_url, is_available: true
  }).select().single();

  const sizes = document.querySelectorAll('.variant_size');
  const mrps = document.querySelectorAll('.variant_mrp');
  const prices = document.querySelectorAll('.variant_price');
  const stocks = document.querySelectorAll('.variant_stock');

  const variants = [];
  for (let i = 0; i < sizes.length; i++) {
    if (sizes[i].value && prices[i].value) {
      variants.push({
        product_id: product.id,
        bag_size: sizes[i].value,
        mrp: parseFloat(mrps[i].value) || 0,
        price: parseFloat(prices[i].value),
        stock_quantity: parseInt(stocks[i].value) || 0,
      });
    }
  }
  if (variants.length > 0) await db.from('product_variants').insert(variants);
  alert('Product added successfully! 🌿');
  showAdminTab('products');
}

function navigate(page) {
  state.page = page;
  render();
}

if(window.location.hash === '#admin') state.page = 'admin';
render();
